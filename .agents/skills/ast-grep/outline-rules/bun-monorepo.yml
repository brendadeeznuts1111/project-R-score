# Extra outline extractors for Bun / sports-terminal / kimi-plugin patterns.
# Use: ast-grep outline --bun-rules  (or: --outline-rules outline-rules/bun-monorepo.yml)
---
id: bun-serve-call
language: TypeScript
role: item
symbolType: function
rule:
  pattern: Bun.serve($$$OPTS)
name: Bun.serve
isExported: false
---
id: bun-serve-call-tsx
language: Tsx
role: item
symbolType: function
rule:
  pattern: Bun.serve($$$OPTS)
name: Bun.serve
isExported: false
---
id: bun-file-call
language: TypeScript
role: item
symbolType: call
rule:
  pattern: Bun.file($$$PATH)
name: Bun.file
isExported: false
---
id: bun-file-call-tsx
language: Tsx
role: item
symbolType: call
rule:
  pattern: Bun.file($$$PATH)
name: Bun.file
isExported: false
---
id: bun-write-call
language: TypeScript
role: item
symbolType: call
rule:
  pattern: Bun.write($$$ARGS)
name: Bun.write
isExported: false
---
id: bun-spawn-call
language: TypeScript
role: item
symbolType: call
rule:
  pattern: Bun.spawn($$$ARGS)
name: Bun.spawn
isExported: false
---
id: bun-sleep-call
language: TypeScript
role: item
symbolType: call
rule:
  pattern: Bun.sleep($$$MS)
name: Bun.sleep
isExported: false
---
id: bun-hash-call
language: TypeScript
role: item
symbolType: call
rule:
  pattern: Bun.hash($$$DATA)
name: Bun.hash
isExported: false
---
id: bun-env-ref
language: TypeScript
role: item
symbolType: constant
rule:
  pattern: Bun.env
name: Bun.env
isExported: false
---
id: bun-sqlite-import
language: TypeScript
role: item
symbolType: module
rule:
  pattern: import { $$$ } from "bun:sqlite"
name: bun:sqlite
isImport: true
isExported: false
---
id: bun-test-import
language: TypeScript
role: item
symbolType: module
rule:
  pattern: import { $$$ } from "bun:test"
name: bun:test
isImport: true
isExported: false
---
id: structured-logger
language: TypeScript
role: item
symbolType: constant
rule:
  pattern: const $NAME = createLogger($LABEL)
name: $NAME
isExported: false
---
id: structured-logger-tsx
language: Tsx
role: item
symbolType: constant
rule:
  pattern: const $NAME = createLogger($LABEL)
name: $NAME
isExported: false
---
id: export-route-handler
language: TypeScript
role: item
symbolType: function
rule:
  pattern: export async function $NAME($$$PARAMS) { $$$BODY }
name: $NAME
isExported: true
---
id: route-handler
language: TypeScript
role: item
symbolType: function
rule:
  pattern: async function $NAME($$$PARAMS) { $$$BODY }
name: $NAME
isExported: false
---
id: outbound-fetch
language: TypeScript
role: item
symbolType: call
rule:
  pattern: fetch($$$ARGS)
name: fetch
isExported: false
---
id: websocket-client
language: TypeScript
role: item
symbolType: call
rule:
  pattern: new WebSocket($$$URL)
name: WebSocket
isExported: false
---
id: mcp-tool-def
language: TypeScript
role: item
symbolType: constant
rule:
  pattern: |
    {
      name: $NAME,
      $$$REST
    }
name: $NAME
isExported: false