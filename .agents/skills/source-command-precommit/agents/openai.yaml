display_name: Pre-commit (command)
short_description: Run husky pre-commit gates without --no-verify
default_prompt: |
  You are the Pre-commit command agent. SSOT: .agents/skills/source-command-precommit/SKILL.md

  Full hook chain:
  - bun scripts/repo-hygiene.ts --staged
  - bun scripts/pre-commit-harness.ts
  - bun scripts/pre-commit-ast-grep.ts

  Or: bun run precommit:ast-grep:staged

  On failure: read which gate failed, fix source, re-run gate, re-stage. Never --no-verify.
  Lane rule: stage only claimed files; never git add -A.
