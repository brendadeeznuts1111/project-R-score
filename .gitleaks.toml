# Gitleaks config for FactoryWager monorepo

[allowlist]
paths = [
  '''node_modules''',
  # Literal .git dirs only — the previous '''.git''' regex (any-char + "git")
  # silently excluded .github/**, .gitignore, .gitleaks.toml, .githooks/**
  # from every scan. Escaped dot + trailing slash keeps VCS internals skipped
  # while security-relevant dotfiles (.github/workflows) are scanned again.
  '''(^|/)\.git/''',
  '''.cache''',
  '''bun.lock''',
  '''package-lock.json''',
  '''yarn.lock''',
  '''.wrangler''',
  '''tools/bun-docs-catalog.json''',
  '''tools/bun-docs-index.json''',
  '''tools/bun-docs-token-supplement.json''',
  # Nested gitignored checkouts + generated/worktree trees — not monorepo source.
  # Keeps the manual full-tree audit (detect --no-git) meaningful; tracked
  # trees (lib/, tests/, projects/, public/, archive/) stay scannable.
  '''.codex-worktrees/''',
  '''artifacts/''',
  '''kimi-toolchain/''',
  '''king-zippy-umbra-acre/''',
  '''toc-ops-repo/''',
  '''Proton-workspace/''',
  '''bradley-terry/''',
]

[[rules]]
id = "factorywager-placeholder-tokens"
description = "Placeholder secret patterns"
regex = '''(?:your_|replace_me|changeme|TODO|place.?holder|xxx)_[A-Z_]+'''
tags = ["placeholder", "secret"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:api[_-]?key|token|secret|password|credential)\s*[:=]\s*['"][A-Za-z0-9_\-\.]{16,}['"]'''
tags = ["key", "API"]
