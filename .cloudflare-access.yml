# .cloudflare-access.yml — scoped policy-as-code for operator surfaces.
#
# STATUS: STAGED — NOT APPLIED. No available token has Cloudflare Access scope
# and the DNS token is Zone.DNS-only. Create a least-privilege Access token,
# store it in Proton Pass, then follow docs/harness/tenants/cloudflare-access.md.
#
# Schema matches src/lib/cloudflare-access-policy.ts (kimi-toolchain):
# apps[].policies[].include/require/exclude entries are Cloudflare Access
# rule groups. `cloudflare_account_member: {}` delegates authentication to
# Cloudflare as IdP and restricts authorization to this account's members.
#
# scoped: true is a hard safety boundary: unlisted live Access apps are ignored.
scoped: true

apps:
  - name: ledger.factory-wager.com
    domain: ledger.factory-wager.com
    type: self_hosted
    session_duration: 8h
    policies:
      - name: Allow Cloudflare account members
        decision: allow
        include:
          - cloudflare_account_member: {}
  - name: reasonix.factory-wager.com
    domain: reasonix.factory-wager.com
    type: self_hosted
    session_duration: 8h
    policies:
      - name: Allow Cloudflare account members
        decision: allow
        include:
          - cloudflare_account_member: {}
  - name: FactoryWager Portal
    domain: score.factory-wager.com/portal
    type: self_hosted
    session_duration: 8h
    policies:
      - name: Allow Cloudflare account members
        decision: allow
        include:
          - cloudflare_account_member: {}
