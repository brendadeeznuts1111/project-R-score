# .cloudflare-access.yml — scoped policy-as-code for operator surfaces.
#
# STATUS (aligned live 2026-08-02):
#   · ledger.factory-wager.com     — APPLIED (app "ledger" · email allowlist)
#   · score.factory-wager.com/portal — APPLIED (app "FactoryWager Portal" · email allowlist)
#   · project-r-score.pages.dev/portal — APPLIED (app "FactoryWager Portal (pages.dev)")
#   · Pages branch/hash previews — PAGES-OWNED TARGET (public until the project
#     Settings > General > Enable access policy control is enabled)
#   · reasonix.factory-wager.com   — DECOMMISSIONED 2026-07-28 (no DNS, no tunnel; app + template removed)
# Access token: Proton factorywager / Cloudflare Access API Token
#   → CLOUDFLARE_ACCESS_API_TOKEN (kimi plan uses CLOUDFLARE_API_TOKEN=that value)
#
# Schema matches lib/verification/cloudflare-access-policy.ts:
# apps[].policies[].include entries are Cloudflare Access rule groups.
# Human SSO contract: explicit `email:` allowlist (Google / One-time PIN IdPs).
# Domain-wide `email_domain` OTP is rejected by the static verifier.
#
# scoped: true is a hard safety boundary: unlisted live Access apps are ignored.
scoped: true

# Operator emails permitted on managed portal / ledger surfaces (OR include).
# Keep in sync with live Access policies when inviting operators.
# (GitHub noreply commit emails cannot authenticate — use real inboxes.)

apps:
