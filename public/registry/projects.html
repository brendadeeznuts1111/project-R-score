<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects Registry • Nola Rose</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    
    :root {
      --bg: #0f1117;
      --card: #161b24;
      --accent: #6366f1;
    }
    
    body {
      font-family: 'Inter', system_ui, sans-serif;
    }
    
    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    .project-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    .stat-card {
      background: linear-gradient(145deg, #161b24, #1f2533);
    }

    .nav-active {
      background-color: #6366f1;
      color: white;
    }

    .category-badge {
      font-size: 0.65rem;
      padding: 1px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .size-badge {
      background: #1f2533;
      color: #94a3b8;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .search-input {
      background: #161b24;
      border: 1px solid #334155;
    }

    .project-row:hover {
      background: #1f2533;
    }

    .empty-state {
      background: linear-gradient(145deg, #161b24, #1a1f2b);
    }
  </style>
</head>
<body class="bg-[#0f1117] text-slate-200">
  <div class="max-w-[1400px] mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between px-8 pt-8 pb-6">
      <div class="flex items-center gap-x-4">
        <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-folder-tree text-white text-2xl"></i>
        </div>
        <div>
          <h1 class="text-3xl font-semibold tracking-tight">Projects Registry</h1>
          <p class="text-slate-400 text-sm">Nola Rose • FactoryWager Enterprise Platform</p>
        </div>
      </div>
      
      <div class="flex items-center gap-x-3">
        <div id="last-updated" class="text-xs text-slate-500 mono px-3 py-1.5 bg-[#161b24] rounded-xl border border-slate-800"></div>
        <button onclick="refreshRegistry()" 
                class="flex items-center gap-x-2 px-4 py-2 bg-[#161b24] hover:bg-[#1f2533] border border-slate-800 rounded-2xl text-sm transition-colors">
          <i class="fa-solid fa-sync-alt"></i>
          <span>Refresh</span>
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 px-8 mb-8">
      <div class="stat-card rounded-3xl p-5 border border-slate-800">
        <div class="text-slate-400 text-xs tracking-wider font-medium">TOTAL PROJECTS</div>
        <div id="stat-total" class="text-4xl font-semibold mt-1 text-white">--</div>
      </div>
      <div class="stat-card rounded-3xl p-5 border border-slate-800">
        <div class="text-slate-400 text-xs tracking-wider font-medium">TOTAL SIZE</div>
        <div id="stat-size" class="text-4xl font-semibold mt-1 text-white">--</div>
      </div>
      <div class="stat-card rounded-3xl p-5 border border-slate-800">
        <div class="text-slate-400 text-xs tracking-wider font-medium">FEATURED</div>
        <div id="stat-featured" class="text-4xl font-semibold mt-1 text-indigo-400">--</div>
      </div>
      <div class="stat-card rounded-3xl p-5 border border-slate-800">
        <div class="text-slate-400 text-xs tracking-wider font-medium">LARGEST CATEGORY</div>
        <div id="stat-largest-cat" class="text-xl font-semibold mt-2 text-white">--</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="px-8 flex flex-col md:flex-row gap-4 items-center mb-6">
      <!-- Search -->
      <div class="relative flex-1 w-full">
        <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-500"></i>
        <input id="search-input" 
               type="text" 
               placeholder="Search projects, descriptions, or tags..." 
               class="search-input w-full pl-11 pr-4 py-3 rounded-2xl text-sm focus:outline-none focus:border-indigo-500 border border-slate-800"
               onkeyup="filterProjects()">
      </div>

      <!-- Filters -->
      <div class="flex gap-2 w-full md:w-auto">
        <select id="category-filter" 
                class="bg-[#161b24] border border-slate-800 rounded-2xl px-4 py-3 text-sm focus:outline-none"
                onchange="filterProjects()">
          <option value="">All Categories</option>
        </select>

        <select id="sort-select" 
                class="bg-[#161b24] border border-slate-800 rounded-2xl px-4 py-3 text-sm focus:outline-none"
                onchange="filterProjects()">
          <option value="size-desc">Size (Largest first)</option>
          <option value="size-asc">Size (Smallest first)</option>
          <option value="name-asc">Name (A-Z)</option>
          <option value="name-desc">Name (Z-A)</option>
        </select>
      </div>

      <!-- View Toggle -->
      <div class="flex bg-[#161b24] border border-slate-800 rounded-2xl p-1">
        <button onclick="setView('cards')" id="view-cards"
                class="px-4 py-2 text-sm rounded-[14px] flex items-center gap-x-2 bg-indigo-600 text-white">
          <i class="fa-solid fa-th-large"></i>
          <span class="hidden sm:inline">Cards</span>
        </button>
        <button onclick="setView('table')" id="view-table"
                class="px-4 py-2 text-sm rounded-[14px] flex items-center gap-x-2 text-slate-400 hover:text-white">
          <i class="fa-solid fa-list"></i>
          <span class="hidden sm:inline">Table</span>
        </button>
      </div>
    </div>

    <!-- Projects Container -->
    <div class="px-8">
      <!-- Cards View -->
      <div id="cards-view" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
        <!-- Populated by JS -->
      </div>

      <!-- Table View -->
      <div id="table-view" class="hidden">
        <div class="bg-[#161b24] border border-slate-800 rounded-3xl overflow-hidden">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-800 bg-[#1a1f2b]">
                <th class="text-left py-4 px-6 font-medium text-slate-400">Project</th>
                <th class="text-left py-4 px-6 font-medium text-slate-400">Category</th>
                <th class="text-right py-4 px-6 font-medium text-slate-400">Size</th>
                <th class="text-left py-4 px-6 font-medium text-slate-400">Last Modified</th>
                <th class="text-center py-4 px-6 font-medium text-slate-400">Tech</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-800">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="h-12"></div>
  </div>

  <script>
    let registry = null;
    let currentView = 'cards';
    let filteredProjects = [];

    async function loadRegistry() {
      try {
        const res = await fetch('./projects-registry.json');
        registry = await res.json();
        renderEverything();
      } catch (e) {
        // Fallback: show a message if JSON not found
        document.body.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-[#0f1117] text-center p-8">
            <div>
              <h1 class="text-3xl font-semibold mb-4">projects-registry.json not found</h1>
              <p class="text-slate-400">Run <code class="bg-[#161b24] px-2 py-px rounded">bun run scripts/generate-project-registry.ts</code> first.</p>
            </div>
          </div>
        `;
      }
    }

    function renderEverything() {
      if (!registry) return;

      // Update meta
      document.getElementById('last-updated').innerHTML = 
        `Generated ${new Date(registry.meta.generated_at).toLocaleString()}`;

      // Stats
      document.getElementById('stat-total').innerText = registry.stats.total_projects;
      document.getElementById('stat-size').innerText = registry.stats.total_size_human;
      document.getElementById('stat-featured').innerText = registry.featured.length;

      // Largest category
      const sortedCats = Object.entries(registry.stats.by_category)
        .sort((a, b) => b[1] - a[1]);
      if (sortedCats.length > 0) {
        document.getElementById('stat-largest-cat').innerHTML = 
          `${sortedCats[0][0]} <span class="text-sm text-slate-400">(${sortedCats[0][1]})</span>`;
      }

      // Populate category filter
      const catSelect = document.getElementById('category-filter');
      catSelect.innerHTML = '<option value="">All Categories</option>';
      
      const allCategories = new Set();
      [...registry.featured, ...registry.projects].forEach(p => allCategories.add(p.category));
      
      Array.from(allCategories).sort().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        catSelect.appendChild(opt);
      });

      filterProjects();
    }

    function filterProjects() {
      if (!registry) return;

      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const categoryFilter = document.getElementById('category-filter').value;
      const sortMode = document.getElementById('sort-select').value;

      const all = [...registry.featured, ...registry.projects];

      filteredProjects = all.filter(p => {
        const matchesSearch = 
          p.name.toLowerCase().includes(searchTerm) ||
          p.description.toLowerCase().includes(searchTerm) ||
          p.path.toLowerCase().includes(searchTerm);

        const matchesCategory = !categoryFilter || p.category === categoryFilter;

        return matchesSearch && matchesCategory;
      });

      // Sorting
      if (sortMode === 'size-desc') {
        filteredProjects.sort((a, b) => b.size_bytes - a.size_bytes);
      } else if (sortMode === 'size-asc') {
        filteredProjects.sort((a, b) => a.size_bytes - b.size_bytes);
      } else if (sortMode === 'name-asc') {
        filteredProjects.sort((a, b) => a.name.localeCompare(b.name));
      } else if (sortMode === 'name-desc') {
        filteredProjects.sort((a, b) => b.name.localeCompare(a.name));
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentView === 'cards') {
        renderCards();
      } else {
        renderTable();
      }
    }

    function renderCards() {
      const container = document.getElementById('cards-view');
      container.innerHTML = '';
      document.getElementById('table-view').classList.add('hidden');
      container.classList.remove('hidden');

      if (filteredProjects.length === 0) {
        container.innerHTML = emptyStateHTML();
        return;
      }

      filteredProjects.forEach(project => {
        const card = document.createElement('div');
        card.className = `project-card bg-[#161b24] border border-slate-800 rounded-3xl p-5 flex flex-col`;

        const categoryColor = getCategoryColor(project.category);

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div>
              <div class="font-semibold text-lg tracking-tight">${project.name}</div>
              <div class="text-[10px] text-slate-500 mono mt-0.5">${project.path}</div>
            </div>
            <div class="category-badge ${categoryColor}">${project.category}</div>
          </div>

          <div class="text-slate-400 text-sm line-clamp-3 flex-1 mb-4">
            ${project.description}
          </div>

          <div class="flex items-center justify-between text-xs">
            <div class="size-badge px-2 py-px">${project.size_human}</div>
            
            <div class="flex items-center gap-x-3 text-slate-500">
              ${project.has_package_json ? '<i class="fa-solid fa-box fa-sm" title="Has package.json"></i>' : ''}
              ${project.has_readme ? '<i class="fa-solid fa-book fa-sm" title="Has README"></i>' : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderTable() {
      const container = document.getElementById('table-view');
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      document.getElementById('cards-view').classList.add('hidden');
      container.classList.remove('hidden');

      if (filteredProjects.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-500">${emptyStateHTML()}</td></tr>`;
        return;
      }

      filteredProjects.forEach(p => {
        const row = document.createElement('tr');
        row.className = 'project-row text-sm';

        const catColor = getCategoryColor(p.category);

        row.innerHTML = `
          <td class="px-6 py-3 font-medium">${p.name}<div class="text-[10px] text-slate-500 mono">${p.path}</div></td>
          <td class="px-6 py-3">
            <span class="category-badge ${catColor}">${p.category}</span>
          </td>
          <td class="px-6 py-3 text-right mono">${p.size_human}</td>
          <td class="px-6 py-3 text-slate-400">${new Date(p.last_modified).toLocaleDateString()}</td>
          <td class="px-6 py-3 text-center text-slate-400">${p.primary_language}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function getCategoryColor(category) {
      const colors = {
        featured: 'bg-amber-500/20 text-amber-400 border border-amber-500/30',
        experimental: 'bg-violet-500/20 text-violet-400 border border-violet-500/30',
        enterprise: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30',
        archive: 'bg-slate-600/30 text-slate-400 border border-slate-600/40',
        utilities: 'bg-sky-500/20 text-sky-400',
        tools: 'bg-orange-500/20 text-orange-400',
        analysis: 'bg-rose-500/20 text-rose-400',
        default: 'bg-slate-700/40 text-slate-300'
      };
      return colors[category] || colors.default;
    }

    function emptyStateHTML() {
      return `
        <div class="empty-state rounded-3xl p-8 text-center border border-slate-800">
          <i class="fa-solid fa-search text-3xl text-slate-600 mb-3"></i>
          <div class="font-medium">No projects match your filters</div>
        </div>
      `;
    }

    function setView(view) {
      currentView = view;
      
      document.getElementById('view-cards').classList.toggle('bg-indigo-600', view === 'cards');
      document.getElementById('view-cards').classList.toggle('text-white', view === 'cards');
      document.getElementById('view-table').classList.toggle('bg-indigo-600', view === 'table');
      document.getElementById('view-table').classList.toggle('text-white', view === 'table');

      renderCurrentView();
    }

    function filterProjectsDebounced() {
      clearTimeout(window.searchTimeout);
      window.searchTimeout = setTimeout(filterProjects, 180);
    }

    function refreshRegistry() {
      location.reload();
    }

    // Keyboard shortcut
    document.addEventListener('keydown', function(e) {
      if (e.key === "/" && document.activeElement.tagName === "BODY") {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });

    // Bootstrap
    window.onload = () => {
      loadRegistry();
    };
  </script>
</body>
</html>
