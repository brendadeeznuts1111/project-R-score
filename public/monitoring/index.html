<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitoring · FactoryWager</title>
  <style>
    :root { --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --border: #30363d; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-monospace, Menlo, monospace; padding: 2rem; }
    h1 { color: var(--accent); font-size: 1.35rem; }
    h2 { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    table { border-collapse: collapse; width: 100%; max-width: 480px; margin: 0 0 1.5rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--muted); font-weight: 500; }
    a { color: var(--accent); }
    nav { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .err { color: #f85149; }
  </style>
</head>
<body>
  <nav>
    <a href="/portal/">Portal</a>
    <a href="/portal/ops/">Ops</a>
    <a href="/api/monitoring">JSON</a>
  </nav>
  <h1>Registry monitoring</h1>
  <p class="meta" id="meta">Loading…</p>
  <div id="root"></div>
  <script type="module">
    function table(title, rows) {
      const keys = rows.length ? Object.keys(rows[0]) : [];
      const head = keys.map(k => '<th>' + k + '</th>').join('');
      const body = rows
        .map(r => '<tr>' + keys.map(k => '<td>' + r[k] + '</td>').join('') + '</tr>')
        .join('');
      return '<h2>' + title + '</h2><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
    }
    async function load() {
      const root = document.getElementById('root');
      const meta = document.getElementById('meta');
      try {
        let res = await fetch('/api/monitoring');
        if (!res.ok) res = await fetch('/registry/monitoring.json');
        if (!res.ok) throw new Error('No monitoring data');
        const d = await res.json();
        meta.textContent =
          'Last updated: ' + (d.timestamp || '—') + ' · source: ' + (d.source || '—') + ' · auto-refresh 30s';
        const platformRows = Object.entries(d.platformSummary || {}).map(([Status, Count]) => ({
          Status,
          Count,
        }));
        const dodRows = Object.entries(d.dodByStatus || {}).map(([Status, Count]) => ({
          Status,
          Count,
        }));
        root.innerHTML =
          table('Overview', [
            { Metric: 'Uptime', Value: d.uptime },
            { Metric: 'Packages', Value: d.packageCount },
            { Metric: 'Versions', Value: d.versionCount },
            { Metric: 'DOD queue', Value: d.dodQueue },
            { Metric: 'Experiments active', Value: d.experimentsActive },
            { Metric: 'Prediction rows', Value: d.predictionN },
          ]) +
          table('Integrity', [
            { Metric: 'Status', Value: d.lastIntegrity?.status },
            { Metric: 'Timestamp', Value: d.lastIntegrity?.timestamp ?? 'never' },
            { Metric: 'Failures', Value: d.lastIntegrity?.failures ?? 0 },
            { Metric: 'Source', Value: d.lastIntegrity?.source ?? 'unknown' },
          ]) +
          table('Platforms', platformRows.length ? platformRows : [{ Status: 'none', Count: 0 }]) +
          table('DOD', dodRows.length ? dodRows : [{ Status: 'none', Count: 0 }]);
      } catch (e) {
        meta.innerHTML =
          '<span class="err">Failed to load. Local: bun run serve:public. Pages: bun run ops:snapshot.</span>';
        root.textContent = String(e);
      }
    }
    load();
    setInterval(load, 30_000);
  </script>
</body>
</html>
