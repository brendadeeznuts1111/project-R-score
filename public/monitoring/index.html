    .mon-page { max-width: 1080px; margin: 0 auto; padding: 24px; }
    .mon-banner {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface); margin-bottom: 16px;
    }
    .mon-banner .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
    .mon-banner.ok .dot { background: var(--green, #3fb950); box-shadow: 0 0 8px var(--green, #3fb950); }
    .mon-banner.warn .dot { background: var(--yellow, #d29922); }
    .mon-banner.bad .dot { background: var(--red, #f85149); }
    .mon-banner .title { font-weight: 600; font-size: 16px; }
    .mon-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; }
    .mon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .mon-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .mon-card h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
      color: var(--text-dim); margin: 0 0 6px; font-weight: 500;
    }
    .mon-card .val { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .mon-card .sub { font-size: 11px; color: var(--text-dim); margin-top: 6px; word-break: break-all; }
    .mon-card.ok .val { color: var(--green, #3fb950); }
    .mon-card.bad .val { color: var(--red, #f85149); }
    .mon-card.warn .val { color: var(--yellow, #d29922); }
    a.mon-card-link {
      display: block;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease;
    }
    a.mon-card-link:hover { border-color: var(--accent); }
    .mon-h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: .35px;
      color: var(--text-dim); margin: 0 0 10px; font-weight: 600;
    }
    .mon-section { margin-bottom: 28px; }
    .mon-section-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
    .mon-table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .mon-table-wrap.narrow { max-width: 480px; }
    .mon-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .mon-table th {
      text-align: left; padding: 8px 10px; color: var(--text-dim); font-weight: 500;
      border-bottom: 1px solid var(--border); background: rgba(255,255,255,.03);
      position: sticky; top: 0;
    }
    .mon-table td { padding: 7px 10px; border-bottom: 1px solid rgba(48,54,61,.35); vertical-align: top; }
    .mon-table tr.critical td:first-child { font-weight: 600; }
    .mon-table .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .mon-table .dim { color: var(--text-dim); }
    .st-ok { color: var(--green, #3fb950); }
    .st-bad { color: var(--red, #f85149); }
    .st-warn { color: var(--yellow, #d29922); }
    .mon-empty { font-size: 13px; color: var(--text-dim); }
    .mon-proof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .mon-proof {
      display: block;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      text-decoration: none;
      color: inherit;
    }
    .mon-proof:hover { border-color: var(--accent); }
    .mon-proof h4 { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin: 0 0 6px; }
    .mon-proof .val { font-size: 18px; font-weight: 600; }
    .mon-proof .sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .mon-proof.ok .val { color: var(--green, #3fb950); }
    .mon-proof.bad .val { color: var(--red, #f85149); }
    .mon-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .mon-actions a {
      font-size: 13px; padding: 6px 12px; border-radius: 6px;
      border: 1px solid var(--border); color: var(--accent); text-decoration: none; background: var(--surface);
    }
    .mon-actions a:hover { border-color: var(--accent); }
