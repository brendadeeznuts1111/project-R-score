<!-- @see docs/portal-foundation.md -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOD Review · FactoryWager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/portal/style.css" />
  <style>
    .hidden { display: none !important; }
    .dod-dashboard { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .dod-head {
      display: flex; flex-wrap: wrap; gap: 16px 24px;
      justify-content: space-between; align-items: flex-start;
      margin-bottom: 16px;
    }
    .dod-title { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
    .dod-sub { margin: 0; font-size: 13px; color: var(--text-dim); max-width: 42ch; line-height: 1.45; }
    .dod-mode {
      display: flex; flex-direction: column; gap: 4px; align-items: flex-end;
      text-align: right; min-width: 220px;
    }
    .dod-mode-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim);
    }
    .dod-mode.live .dod-mode-pill { color: var(--green, #3fb950); border-color: rgba(63,185,80,.45); background: rgba(63,185,80,.1); }
    .dod-mode.snapshot .dod-mode-pill { color: var(--text-dim); }
    .dod-mode.warn .dod-mode-pill { color: var(--yellow, #d29922); border-color: rgba(210,153,34,.5); background: rgba(210,153,34,.12); }
    .dod-mode-detail { font-size: 12px; color: var(--text-dim); max-width: 36ch; line-height: 1.4; }
    .dod-mode-time { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; opacity: .8; }
    .dod-help {
      margin: 0 0 16px; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface); color: var(--text-dim); font-size: 12px;
    }
    .dod-help summary { cursor: pointer; color: var(--text); font-weight: 500; }
    .dod-help p { margin: 10px 0 8px; line-height: 1.45; }
    .dod-help pre {
      margin: 0; padding: 10px 12px; border-radius: 6px; overflow: auto;
      background: var(--bg); border: 1px solid var(--border); font-size: 12px;
    }
    .dod-stats {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px;
      margin-bottom: 18px;
    }
    .dod-stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
    }
    .dod-stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
    .dod-stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .dod-stat.hot { border-color: rgba(248,81,73,.45); }
    .dod-stat.hot .v { color: var(--red, #f85149); }
    .dod-stat.ok .v { color: var(--green, #3fb950); }
    .dod-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .dod-filter {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface); color: var(--text-dim); cursor: pointer; font-size: 12px;
    }
    .dod-filter-label { text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .dod-filter-count {
      min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: .85;
    }
    .dod-filter.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    .dod-filter.flagged { border-color: rgba(248,81,73,.35); }
    .dod-filter.flagged.active { background: rgba(248,81,73,.12); border-color: var(--red); color: var(--red); }
    .dod-list { display: flex; flex-direction: column; gap: 12px; }
    .dod-card {
      display: grid; grid-template-columns: 160px 1fr auto; gap: 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; align-items: start;
    }
    .dod-card.flagged { border-color: rgba(248,81,73,.4); }
    .dod-card.verified { border-color: rgba(63,185,80,.35); }
    .dod-card.rejected { opacity: .72; }
    .dod-preview { display: flex; flex-direction: column; gap: 8px; }
    .dod-preview img {
      width: 160px; height: 110px; object-fit: cover; border-radius: 6px;
      background: var(--surface-hover); border: 1px solid var(--border);
    }
    .dod-preview-empty {
      width: 160px; height: 110px; border-radius: 6px; border: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 12px; background: var(--surface-hover);
    }
    .dod-card-top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .dod-status-pill {
      font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em;
      padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim);
    }
    .dod-status-pill.flagged { color: var(--red); border-color: rgba(248,81,73,.45); background: rgba(248,81,73,.1); }
    .dod-status-pill.verified { color: var(--green); border-color: rgba(63,185,80,.45); background: rgba(63,185,80,.1); }
    .dod-status-pill.rejected { color: var(--text-dim); }
    .dod-status-pill.pending { color: var(--yellow, #d29922); border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.1); }
    .dod-type { font-size: 12px; color: var(--text-dim); text-transform: capitalize; }
    .dod-meta {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0;
    }
    .dod-meta div { min-width: 0; }
    .dod-meta dt {
      margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
    }
    .dod-meta dd { margin: 2px 0 0; font-size: 13px; word-break: break-word; }
    .dod-meta code { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .dod-ocr {
      margin: 12px 0 0; padding: 8px 10px; border-radius: 6px;
      background: var(--surface-hover); color: var(--text-dim); font-size: 12px; line-height: 1.45;
    }
    .dod-actions { display: flex; flex-direction: column; gap: 8px; min-width: 110px; }
    .dod-actions button {
      padding: 8px 12px; border-radius: 6px; border: 1px solid transparent;
      cursor: pointer; font-size: 12px; font-weight: 650;
    }
    .dod-actions button:disabled { opacity: .5; cursor: wait; }
    .btn-approve { background: rgba(46,204,113,.12); color: var(--green); border-color: rgba(63,185,80,.45); }
    .btn-approve:hover:not(:disabled) { background: var(--green); color: var(--bg); }
    .btn-reject { background: rgba(231,76,60,.12); color: var(--red); border-color: rgba(248,81,73,.45); }
    .btn-reject:hover:not(:disabled) { background: var(--red); color: var(--bg); }
    .tamper-badge {
      font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 650; text-align: center;
    }
    .tamper-low { background: rgba(46,204,113,.15); color: var(--green); }
    .tamper-high { background: rgba(231,76,60,.15); color: var(--red); }
    .reject-reason {
      margin-top: 10px; padding: 8px 10px; background: rgba(248,81,73,.08);
      border: 1px solid rgba(248,81,73,.25); border-radius: 6px; font-size: 12px; color: var(--text-dim);
    }
    .dod-empty { text-align: center; padding: 56px 20px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: var(--radius); }
    .dod-empty-title { margin: 0; font-size: 16px; font-weight: 600; color: var(--text); }
    .dod-empty-sub { font-size: 13px; margin: 10px auto 0; max-width: 48ch; line-height: 1.5; }
    .dod-toast {
      position: fixed; right: 16px; bottom: 16px; z-index: 40;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .dod-toast-item {
      min-width: 180px; max-width: 320px; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-size: 13px; opacity: 0; transform: translateY(8px); transition: .18s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .dod-toast-item.show { opacity: 1; transform: translateY(0); }
    .dod-toast-item.ok { border-color: rgba(63,185,80,.45); }
    .dod-toast-item.err { border-color: rgba(248,81,73,.5); color: var(--red); }
    .dod-modal {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.55); padding: 20px;
    }
    .dod-modal-card {
      width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 18px;
    }
    .dod-modal-card h3 { margin: 0 0 8px; font-size: 16px; }
    .dod-modal-card p { margin: 0 0 12px; font-size: 13px; color: var(--text-dim); }
    .dod-modal-card textarea {
      width: 100%; min-height: 90px; resize: vertical; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      padding: 10px; font: inherit; margin-bottom: 12px;
    }
    .dod-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .dod-modal-actions button {
      padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface-hover); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .dod-modal-actions .primary { background: rgba(248,81,73,.15); border-color: rgba(248,81,73,.45); color: var(--red); }
    @media (max-width: 800px) {
      .dod-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dod-card { grid-template-columns: 1fr; }
      .dod-preview img, .dod-preview-empty { width: 100%; height: 160px; }
      .dod-mode { align-items: flex-start; text-align: left; }
      .dod-meta { grid-template-columns: 1fr; }
    }
