  <style>
    .toc-dashboard { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .toc-head {
      display: flex; flex-wrap: wrap; gap: 16px 24px;
      justify-content: space-between; align-items: flex-start;
      margin-bottom: 16px;
    }
    .toc-title { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
    .toc-sub { margin: 0; font-size: 13px; color: var(--text-dim); line-height: 1.45; }
    .toc-mode { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; text-align: right; }
    .toc-mode-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim);
    }
    .toc-mode-time { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); }
    .toc-stats {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 900px) {
      .toc-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .toc-stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
    }
    .toc-stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
    .toc-stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .toc-stat.hot { border-color: rgba(248,81,73,.45); }
    .toc-stat.hot .v { color: var(--red, #f85149); }
    .toc-stat.ok .v { color: var(--green, #3fb950); }
    .toc-buffer {
      margin-bottom: 18px; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface); font-size: 13px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .toc-partner {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); padding: 16px; margin-bottom: 14px;
    }
    .toc-partner h3 { margin: 0 0 4px; font-size: 18px; display: flex; gap: 8px; align-items: center; }
    .toc-partner h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
    .toc-cols {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
      margin-top: 14px;
    }
    .toc-partner ul { margin: 0; padding-left: 18px; font-size: 13px; }
    .toc-partner li { margin-bottom: 6px; }
    .toc-pill {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border);
      color: var(--text-dim); vertical-align: middle;
    }
    .toc-pill-ok { color: var(--green, #3fb950); border-color: rgba(63,185,80,.45); background: rgba(63,185,80,.1); }
    .toc-pill-hot { color: var(--red, #f85149); border-color: rgba(248,81,73,.45); background: rgba(248,81,73,.1); }
    .toc-foot { margin-top: 20px; font-size: 12px; color: var(--text-dim); }
    .toc-foot a { color: var(--accent); }
  </style>
