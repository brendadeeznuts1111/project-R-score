name: Repo Hygiene

# Main/PR install+hygiene lives in harness-gates (ci:core). This workflow
# only covers long-lived feature branches that do not run harness-gates.
on:
  push:
    branches:
      - feat/**
      - codex/**
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Factory Bun
        uses: ./.github/actions/setup-factory-bun

      - name: Verify install cache
        run: bun run install:verify:strict

      - name: Cache lifecycle dry-run
        run: bun run install:cache:lifecycle

      - name: Run Repo Hygiene
        run: bun run hygiene
