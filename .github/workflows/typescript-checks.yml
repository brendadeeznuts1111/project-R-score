name: TypeScript Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: typescript-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type Check (CI Scope)
            command: bun run type-check:ci
          - name: Type Check (Full Scope)
            command: bun run type-check:full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Factory Bun
        uses: ./.github/actions/setup-factory-bun

      - name: Verify TypeScript Check Config
        run: bun run ts:verify

      - name: Verify Package Import Boundaries
        run: bun run imports:verify

      - name: Spine path-bun + Bun.env ratchets
        run: bun run check:path-bun && bun run check:bun-env

      - name: Run Type Check
        run: ${{ matrix.command }}
