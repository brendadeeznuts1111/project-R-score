# Security Scanner CI — Bun Security Scanner via `bun pm scan`.
#
# Free mode works without SOCKET_API_KEY but spends roughly one public Socket
# request per lockfile package. Path filters keep the scan tied to dependency,
# scanner-policy, and workflow changes. PRs are advisory while main is fail-closed.
name: Security Scanner

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - bunfig.toml
      - tools/portal-cli.ts
      - tools/lib/portal-cli-scanner.ts
      - .github/actions/setup-factory-bun/action.yml
      - .github/workflows/security-scanner.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - bunfig.toml
      - tools/portal-cli.ts
      - tools/lib/portal-cli-scanner.ts
      - .github/actions/setup-factory-bun/action.yml
      - .github/workflows/security-scanner.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Bun Security Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v4; pin prevents tag retargeting in this security lane.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Factory Bun
        uses: ./.github/actions/setup-factory-bun

      - name: Scanner status
        run: bun run portal-cli scanner status

      - name: Scan dependencies
        id: scan
        run: bun run scanner:ci
        # PRs: report advisories without blocking merges.
        # Main: continue-on-error=false so a non-zero scanner exit fails the job.
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Report scanner advisories
        if: github.event_name == 'pull_request' && steps.scan.outcome == 'failure'
        run: |
          echo "::warning::Security scanner reported advisories; see the Scan dependencies step above."
          echo "::warning::PRs are advisory-only. Main-branch pushes will fail on a non-zero scanner exit."
