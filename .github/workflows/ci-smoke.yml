name: CI Smoke

# Manual install-only probe. Push/PR install journey lives in:
#   fast (strict) → repo-hygiene.yml (install:verify:strict + hygiene)
#   full          → harness-gates.yml (bun run ci:harness)
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun scripts/with-bun-cache-env.ts ci

      - name: proof:install (journey)
        run: bun run proof:install
