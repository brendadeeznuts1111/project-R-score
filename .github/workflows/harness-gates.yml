name: Harness Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    # Keep this name stable — branch protection requires it.
    name: Harness (ratchets · lint · brands · test:changed)
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
      # Full-tree ESLint only on push to main; PRs lint the change set.
      HARNESS_FULL_LINT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Factory Bun
        uses: ./.github/actions/setup-factory-bun
        with:
          eslint-cache: 'true'

      - name: Claim → evidence
        if: github.event_name == 'pull_request'
        run: bun scripts/check-pr-claim.ts --event "$GITHUB_EVENT_PATH"

      # One install: verify + hygiene + ci:harness (was a second repo-hygiene job).
      - name: CI core
        run: bun run ci:core
