name: Harness Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    # Keep this name stable — branch protection requires it.
    name: Harness (ratchets · lint · brands · test:changed)
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
      # Full-tree ESLint only on push to main; PRs lint the change set.
      HARNESS_FULL_LINT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Factory Bun
        uses: ./.github/actions/setup-factory-bun
        with:
          eslint-cache: 'true'

      - name: Claim → evidence
        if: github.event_name == 'pull_request'
        run: bun scripts/check-pr-claim.ts --event "$GITHUB_EVENT_PATH"

      # Fail-closed preview (exit 0): logs WOULD_FAIL / WOULD_PASS until WARN_UNTIL_ISO.
      - name: Claim → evidence (dry-run)
        if: github.event_name == 'pull_request'
        run: bun scripts/check-pr-claim.ts --dry-run --event "$GITHUB_EVENT_PATH"

      # packages/README decision tables must match docs-index.json (same idea as REGISTRY.md).
      - name: Packages docs-index sync
        run: bun run packages:docs-index:check

      # Vault-map inventory + health report-shape SSOT (offline; no pass-cli session).
      # Intentional drift: portal-cli vault health --update → commit the .snap
      - name: Vault health snapshots
        run: bun test tests/vault-health.test.ts

      # Capability-map subset bake fingerprint + Bun snapshot SSOT (offline).
      # Intentional drift: bun run bake:capabilities:update → commit JSON + .snap
      - name: Capability map snapshots
        run: bun test tests/capability-map-subset.test.ts

      # Reviewed bun:test snapshot catalog (orphan / header / entry-count).
      - name: Bun test snapshot SSOT
        run: bun run check:snapshots

      # minBun floors only (CI has Bun; pass-cli optional).
      - name: Capability doctor (Bun floors)
        run: bun run portal-cli capabilities doctor --bun-only

      # Machine ~/.bunfig.toml from committed template (CI-portable SSOT).
      - name: Machine bunfig SSOT
        run: bun run machine:bunfig:ensure -- --overwrite

      # Portal doctor offline pure checks (linker · bakes · catalog · bunfig · infra offline).
      # One process: plain CI log + reports/portal-doctor-ci.json + GITHUB_STEP_SUMMARY.
      - name: Portal doctor (offline)
        id: portal-doctor
        run: bun run portal:doctor:ci:report

      # JSON forensics when doctor (or prior step) fails — path is gitignored locally.
      - name: Upload portal doctor CI report
        if: failure() && steps.portal-doctor.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: portal-doctor-ci
          path: reports/portal-doctor-ci.json
          if-no-files-found: ignore

      # doctor-state.json fingerprint gate (stable ids/ok/level — offline Access).
      # Forensics: reports/doctor-state-check.json + GITHUB_STEP_SUMMARY + ::error title=doctor-state::
      - name: Portal doctor-state fingerprint
        id: doctor-state-check
        run: bun run bake:doctor:check:report

      - name: Upload doctor-state check report
        if: failure() && steps.doctor-state-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: doctor-state-check
          path: reports/doctor-state-check.json
          if-no-files-found: ignore

      # One install: verify + hygiene + ci:harness (was a second repo-hygiene job).
      - name: CI core
        run: bun run ci:core

      # Hard fail if new Proton Pass / env.template secret gaps appear (no live vault needed).
      - name: Env vault-gap ratchet
        run: bun run env:inventory:ratchet

      # MA/NJ compliance board bake + portal/route/health freeze tests (offline-safe).
      - name: Compliance verify
        run: bun run compliance:verify
