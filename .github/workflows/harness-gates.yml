name: Harness Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness (ratchets · lint · brands · test:changed)
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
      # Full-tree ESLint only on push to main; PRs lint the change set.
      HARNESS_FULL_LINT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun scripts/with-bun-cache-env.ts ci

      - name: Harness gates
        run: bun run ci:harness
