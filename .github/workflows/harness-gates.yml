name: Harness Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness (ratchets · lint · brands · test:changed)
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
      # Full-tree ESLint only on push to main; PRs lint the change set.
      HARNESS_FULL_LINT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install
        run: bun scripts/with-bun-cache-env.ts ci

      - name: Cache ESLint (bun-native)
        uses: actions/cache@v4
        with:
          path: .cache/eslint-bun-native
          key: eslint-bun-native-${{ runner.os }}-${{ hashFiles('eslint.bun-native.config.ts', 'eslint.harness.config.ts', 'config/eslint/**/*.ts', 'package.json') }}
          restore-keys: |
            eslint-bun-native-${{ runner.os }}-

      - name: Claim → evidence
        if: github.event_name == 'pull_request'
        # Warn-only until 2026-07-28 (script default); no second runner/install.
        run: bun scripts/check-pr-claim.ts --event "$GITHUB_EVENT_PATH"

      - name: Harness gates
        run: bun run ci:harness
