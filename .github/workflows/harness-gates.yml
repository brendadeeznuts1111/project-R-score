name: Harness Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness (install · lint · brands · spine smokes)
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun scripts/with-bun-cache-env.ts ci

      - name: Harness gates
        run: bun run ci:harness
