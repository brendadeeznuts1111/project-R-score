name: Bun Cache Prune (self-hosted)

on:
  workflow_dispatch:
    inputs:
      prune:
        description: "Run bun pm cache rm when over threshold"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  cache-prune-self-hosted:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.prune == 'true'
    runs-on: self-hosted
    env:
      BUN_INSTALL_GLOBAL_STORE: "1"
      CI_SELF_HOSTED: "1"
      BUN_CACHE_PRUNE: "1"
      BUN_CACHE_PRUNE_MAX_MB: "2048"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prune stale install cache when over threshold
        run: bun scripts/bun-cache-lifecycle.ts --prune --json | tee cache-prune.json

      - name: Upload prune report
        uses: actions/upload-artifact@v4
        with:
          name: bun-cache-prune-report
          path: cache-prune.json
          retention-days: 14
