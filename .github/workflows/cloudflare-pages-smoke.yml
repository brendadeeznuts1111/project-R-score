# Optional live smoke after deploy (workflow_dispatch — does not block merge).
# Requires repo secret CLOUDFLARE_API_TOKEN (Pages Edit on project-r-score).
name: cloudflare-pages-smoke

on:
  workflow_dispatch:
    inputs:
      taxonomy:
        description: Run full taxonomy edge checks (13 contracts)
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Preflight (static)
        run: bun run cloudflare:preflight
      - name: Deploy wait + edge verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ inputs.taxonomy }}" = "true" ]; then
            bun run cloudflare:deploy:verify:taxonomy
          else
            bun run cloudflare:deploy:verify
          fi
