name: PR Claim Evidence

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-claim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claim-evidence:
    name: Claim → evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check PR claim → evidence
        # Warn-only until 2026-07-28 (script default); add --strict to fail early.
        run: bun scripts/check-pr-claim.ts --event "$GITHUB_EVENT_PATH"
