name: demo-module-contract

on:
  pull_request:
    paths:
      - '**/demo*/**'
      - 'scripts/**/*demo*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/demo-module-contract.yml'
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'codex/**'
    paths:
      - '**/demo*/**'
      - 'scripts/**/*demo*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/demo-module-contract.yml'
  workflow_dispatch:

jobs:
  validate-demo-contract:
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
      BUN_INSTALL_GLOBAL_STORE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Factory Bun
        uses: ./.github/actions/setup-factory-bun

      - name: Validate demo module contract
        run: bun run ci:demo:contract
