name: Verify Bun APIs

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/bun-api-oneliners.ts'
      - 'tools/bun-ops-oneliners.ts'
      - 'tools/bun-api-verify.ts'
      - 'lib/bun-api-proof.ts'
      - 'lib/operations/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'tools/bun-api-oneliners.ts'
      - 'tools/bun-ops-oneliners.ts'
      - 'tools/bun-api-verify.ts'
      - 'lib/bun-api-proof.ts'
      - 'lib/operations/**'
  workflow_dispatch:

concurrency:
  group: verify-bun-apis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Three-source API proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Factory Bun
        uses: ./.github/actions/setup-factory-bun

      - name: Run verification harness
        run: bun tools/bun-api-verify.ts --write

      - name: Run verification tests
        run: bun test tests/bun-api-verify.test.ts

      - name: Check proof manifest drift
        run: |
          if ! git diff --exit-code tools/bun-api-coverage-proof.json; then
            echo "::warning::API proof manifest changed — review and commit tools/bun-api-coverage-proof.json"
            git diff --stat tools/bun-api-coverage-proof.json
          fi
