name: Setup Factory Bun CI
description: >
  Bun + install-cache restore + bun ci. Caller must checkout first.
  Optional ESLint cache restore for harness lint.

inputs:
  bun-version-file:
    description: Repository-relative Bun version SSOT for oven-sh/setup-bun
    required: false
    default: .bun-version
  eslint-cache:
    description: Restore/save .cache/eslint-bun-native
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Bun
      # oven-sh/setup-bun v2; exact pin prevents tag retargeting.
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: ${{ inputs.bun-version-file }}

    - name: Cache Bun install
      # actions/cache v4; exact pin prevents tag retargeting.
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: /home/runner/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Machine bunfig SSOT
      shell: bash
      run: bun scripts/ensure-machine-bunfig.ts --overwrite
      # Installs ~/.bunfig.toml from config/machine.bunfig.toml.template (absolute cache.dir)

    - name: Install
      shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: /home/runner/.bun/install/cache
        BUN_INSTALL_GLOBAL_STORE: '1'
      run: bun scripts/with-bun-cache-env.ts ci

    - name: Cache ESLint (bun-native)
      if: inputs.eslint-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .cache/eslint-bun-native
        key: eslint-bun-native-${{ runner.os }}-${{ hashFiles('eslint.harness.config.ts', 'config/eslint/**/*.ts', 'package.json') }}
        restore-keys: |
          eslint-bun-native-${{ runner.os }}-
