name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.44.0

      - name: Run quality gates and generate report
        run: bun run gate-report

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            reports/gate-report.html
            reports/gate-report.json
            reports/history.jsonl
          if-no-files-found: ignore