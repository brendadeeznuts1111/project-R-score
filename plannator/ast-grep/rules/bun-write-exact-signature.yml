id: bun-write-exact-signature
language: TypeScript
severity: error
message: "Bun.write expects (path: string | URL, data: string | Blob | ...)"
note: "Signature is Bun.write(destination, data) — see docs/references/bun-api-reference.md"
ignores:
  - ".agents/**"
rule:
  any:
    - pattern: Bun.write()
    - pattern: Bun.write($A)
    - pattern: Bun.write($A, $B, $C)
