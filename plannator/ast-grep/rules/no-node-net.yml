id: no-node-net
language: TypeScript
severity: warning
message: "Prefer Bun.connect / Bun.listen over node:net in Bun projects"
note: "See docs/references/bun-api-reference.md for Bun networking patterns"
ignores:
  - ".agents/**"
rule:
  any:
    - pattern: import { $$$ } from "net"
    - pattern: import $X from "net"
    - pattern: import { $$$ } from "node:net"
    - pattern: import $X from "node:net"
