id: no-node-child-process
language: TypeScript
severity: warning
message: "Prefer Bun.spawn over child_process in Bun projects"
note: "See docs/references/bun-api-reference.md for Bun.spawn patterns"
ignores:
  - ".agents/**"
rule:
  any:
    - pattern: import { $$$ } from "child_process"
    - pattern: import $X from "child_process"
    - pattern: import { $$$ } from "node:child_process"
    - pattern: import $X from "node:child_process"
