# Machine-readable planning artifact for docs/design/partner-dashboard-mvp.md.
# This is not runtime configuration and is not a new source of business truth.

[plan]
schema = "factorywager.partner-dashboard-plan.v2"
status = "proposal"
last_reviewed = "2026-08-06"
owner = "@factorywager/partners"

[domain]
id = "partners"
primary_concept_namespaces = ["partner", "out"]

[documentation]
inventory_row_id = "doc.partner-dashboard-mvp"
ref_id = "0.1.partner-dashboard-mvp"
markdown_path = "docs/design/partner-dashboard-mvp.md"
concept_domains = ["partners", "accounting", "telegram", "compliance", "trading", "portal", "operations"]
chrome_domains = ["partner"]
primary_portal_href = "/portal/partners/"

[package]
target_name = "@factorywager/partners"
target_workspace = "packages/partners"
implementation_status = "artifact-core-implemented"

[package.components]
identifiers = "implemented"
artifact_boundary = "implemented"
artifact_assembler = "implemented"
ingress_translator = "implemented"
legacy_ops_adapter = "implemented"
portal_consumer_contract = "implemented"
profile_coverage_adapter = "implemented"
out_capability_contract = "implemented"
execution_constraint_evaluator = "implemented"
bookmaker_account_resolver = "implemented"
tennis_capacity_adapter = "implemented"
telegram_handshake_adapter = "implemented"
limit_change_adapter = "implemented"
current_compatibility_fetch_transport = "implemented"
canonical_dashboard_browser_loader = "implemented"
connector_ports = "partial"
source_adapters = "partial"
reconciliation = "planned"

[toolchain]
authority = "config/bun-channels.toml"
governance = "docs/design/bun-channel-governance.md"
status_artifact = "public/registry/bun-channel-status.json"
policy = "reference-only-partner-domain-does-not-own-runtime-or-type-channels"

[shapes.dashboard_artifact]
type = "PartnerDashboardArtifact"
schema = "factorywager.partners-dashboard.v1"
active_legacy_schema = "factorywager.partners-dashboard.v1"
retired_legacy_schema = "factorywager.partners-dashboard.v2"
path = "/registry/partners-dashboard.json"
canonical_join_type = "PartnerCode"
canonical_wire_key = "partnerCode"
display_identity_label = "CODE"
artifact_embeds_colors = false
active_out_identity_field = "activeOutIds"
conflict_value_policy = "redacted-json-scalars-only"

[shapes.profile_coverage_artifact]
type = "PartnerProfileCoverageArtifact"
schema = "factorywager.partner-profile-coverage.v1"
path = "/registry/partner-profile-coverage.json"
implementation_status = "implemented"
role = "implementation-readiness-input"
dashboard_connector = false
public_fact_paths = ["generatedAt", "evidenceByPartnerCode.*.callSign", "evidenceByPartnerCode.*.profileDocumentVersion"]
forbidden_fact_classes = ["lifecycle", "phase", "credentials", "funding", "telegram", "accounting", "money", "policy"]
lifecycle_authority = false

[shapes.out_capability_snapshot]
type = "PartnerOutCapabilitySnapshot"
schema = "factorywager.partner-out-capability.v1"
implementation_status = "implemented"
parser = "parsePartnerOutCapabilitySnapshot"
evaluator = "evaluateExecutionConstraints"
role = "private-authenticated-out-preflight"
required_limit_kinds = ["max_stake", "max_gross_payout", "max_net_win"]
url_policy = "absolute-http-or-https-without-credentials-query-or-fragment"
missing_constraint_policy = "manual-review-never-assume-unlimited"
odds_money_policy = "caller-supplies-integer-projected-gross-payout-and-net-win"

[adapters.bookmaker_account_resolver]
export = "./adapters/bookmaker-account"
implementation_status = "implemented"
input = "sanitized-account-entrypoint-url-plus-bookmaker-registry"
exact_match_policy = "exact-host-with-www-normalization"
alternate_host_policy = "explicit-host-alias-only"
unknown_host_policy = "manual-review-no-parent-domain-or-substring-guess"
manual_resolution_policy = "operator-selected-registered-sportsbook-id"
registry_input_status = "implemented-public-catalog-parser"
registry_io_status = "planned-owned-by-bookmakers-registry-connector"

[adapters.bookmakers_catalog]
export = "./adapters/bookmakers"
implementation_status = "implemented"
schema_version = 2
artifact_name = "@factorywager/bookmakers"
identity_policy = "object-key-equals-id-equals-slug"
host_policy = "unique-normalized-host"
projection_policy = "id-slug-label-skin-brand-group-web-url-only"
ops_only_field_policy = "reject"

[adapters.tennis_capacity]
export = "./adapters/tennis-capacity"
implementation_status = "implemented"
schema_version = 1
kind = "tennis-partner-contracts"
runtime = "https://tennis.factory-wager.com"
execution_evidence_policy = "live-source-only"
book_identity_policy = "explicit-external-book-ref-map"
offline_policy = "visibility-only-no-max-stake-promotion"

[adapters.telegram_handshake]
export = "./adapters/telegram-handshake"
implementation_status = "implemented"
schema = "factorywager.telegram-handshake.v1"
invite_url_policy = "drop-at-partner-boundary"
membership_policy = "not-exposed-by-current-artifact"
topic_policy = "not-exposed-by-current-artifact"

[adapters.limit_changes]
export = "./adapters/limit-changes"
implementation_status = "implemented"
schema_version = 3
identity_policy = "explicit-tree-node-and-sportsbook-maps"
money_policy = "usd-major-units-to-exact-integer-cents"
execution_ceiling_policy = "never-current-ceiling-change-event-only"

[surfaces.portal]
board_id = "partners"
host_surface_id = "score"
route = "/portal/partners/"
page_concept_id = "page.partners"
target_consumer = "PartnerDashboardArtifact"

[surfaces.portal.consumer_contract]
entrypoint_path = "public/portal/partners/index.html"
implementation_status = "implemented"
active_input_mode = "canonical-single-artifact"
required_input_refs = ["/registry/partners-dashboard.json"]
optional_input_refs = []
target_shape_ref = "shapes.dashboard_artifact"
target_input_mode = "canonical-single-artifact"
retirement_condition = "portal-loads-only-target-artifact"
transition_implementation_status = "retired"
transition_input_mode = "canonical-single-artifact"
canonical_input_ref = "/registry/partners-dashboard.json"
canonical_failure_policy = "error-never-fallback"
automatic_legacy_fallback = false

[surfaces.portal.consumer_contract.current_fetch_transport]
module_ref = "/portal/fetch-json.js"
export_name = "fetchJsonResult"
default_timeout_ms = 5000
content_type_diagnostic_policy = "advisory-debug-gated"
required_failure_policy = "throw-path-qualified-error"
optional_failure_policy = "explicit-catch-to-null"

# legacy_comparison removed — ?compare=legacy retired; board loads only partners-dashboard.json

[semantic_model]
semantic_order = ["business-domain", "concept", "parsed-shape", "consuming-surface"]
presentation_layer = "theme-after-surface"
authority = "docs/DOMAIN_CONCEPT_SHAPE.md"
policy = "theme roles present meaning but never define or replace domain state"

[nomenclature]
policy = "canonical-types-and-axis-qualified-wire-keys"
business_domain = "owner of stable business meaning; not a hostname or concept namespace"
vocabulary_namespace = "first dotted concept-id segment; not business ownership"
concept_id = "stable semantic identity; reuse before proposing a new concept"
parsed_shape = "validated representation trusted after an ingress or adapter boundary"
surface = "portal, API, artifact, CLI, or operator consumer"
theme_role = "presentation-only alias resolved through public/portal/theme.jsonc"
source_system = "authority named in provenance"
connector = "I/O boundary owning timeout, circuit breaker, and last-known-good behavior"
adapter = "pure parser and normalizer from one connector payload to canonical facts"
port = "core-owned typed interface receiving canonical facts"
projection = "read-model join producing the dashboard artifact"

[[nomenclature.term]]
canonical = "PartnerCode"
wire_path = "partners[].partnerCode"
owner_domain = "partners"
meaning = "canonical partner join key"
forbidden_core_aliases = ["partnerId", "code"]

[[nomenclature.term]]
canonical = "ProfileDocumentVersion"
wire_path = "evidenceByPartnerCode.*.profileDocumentVersion"
owner_domain = "partners"
meaning = "source profile document revision; not the coverage artifact schema or template version"
forbidden_core_aliases = ["schemaVersion", "templateVersion"]

[[nomenclature.term]]
canonical = "PartnerLifecycleState"
wire_path = "partners[].lifecycle.state"
owner_domain = "partners"
meaning = "canonical eight-state onboarding and relationship lifecycle"
forbidden_core_aliases = ["status", "ops.limits.lifecycle_state"]
legacy_compatibility_aliases = ["PartnerLifecycleStatus", "lifecycle.status"]
current_type = "PartnerLifecycleStatus"
target_type = "PartnerLifecycleState"
migration_status = "planned"

[[nomenclature.term]]
canonical = "PartnerOperationalPhase"
wire_path = "partners[].operationalPhase"
owner_domain = "partners"
meaning = "derived operator summary; never lifecycle authority"
forbidden_core_aliases = ["lifecycle", "status"]
current_type = "PartnerPhase"
target_type = "PartnerOperationalPhase"
migration_status = "planned"

[[nomenclature.term]]
canonical = "OutId"
wire_path = "partners[].outs[].outId"
owner_domain = "partners"
meaning = "canonical partner sportsbook-account identity"
forbidden_core_aliases = ["accountId", "CODE-N"]
implementation_status = "planned"

[[nomenclature.term]]
canonical = "ExternalPartnerRef"
wire_path = "partners[].identity.externalPartnerRefs[]"
owner_domain = "partners"
meaning = "source-qualified non-canonical partner identifier"
forbidden_core_aliases = ["id", "partnerId"]

[[nomenclature.term]]
canonical = "ExternalAccountRef"
wire_path = "partners[].outs[].externalAccountRefs[]"
owner_domain = "trading"
meaning = "source-qualified non-canonical provider account identifier"
forbidden_core_aliases = ["id", "accountId"]

[[nomenclature.term]]
canonical = "OutOperationalStatus"
wire_path = "partners[].outs[].operationalStatus"
owner_domain = "partners"
meaning = "whether an out can be operated"
forbidden_core_aliases = ["status", "fundStatus", "providerStatus"]

[[nomenclature.term]]
canonical = "OutFundingStatus"
wire_path = "partners[].outs[].fundingStatus"
owner_domain = "accounting"
meaning = "funding completeness for an explicitly scoped account"
forbidden_core_aliases = ["status", "operationalStatus"]

[[nomenclature.term]]
canonical = "ProviderConnectionStatus"
wire_path = "partners[].outs[].providerConnectionStatus"
owner_domain = "trading"
meaning = "external provider connectivity only"
forbidden_core_aliases = ["status", "operationalStatus"]

[[nomenclature.term]]
canonical = "ConnectorDataStatus"
wire_path = "connectorSnapshots.*.dataStatus"
owner_domain = "operations"
meaning = "configured connector result availability and freshness"
forbidden_core_aliases = ["status", "lifecycle"]

[[nomenclature.term]]
canonical = "MoneyAmount"
owner_domain = "accounting"
meaning = "currency plus safe integer minorUnits"
wire_shape = "{ currency, minorUnits }"
forbidden_core_aliases = ["balanceNumber", "amountCents", "floatAmount"]

[[nomenclature.term]]
canonical = "AccountScope"
wire_path = "partners[].accounting.*.accountScope"
owner_domain = "accounting"
meaning = "structured partner, out, or rail financial scope"
forbidden_core_aliases = ["scope", "colonDelimitedScope"]

[[nomenclature.term]]
canonical = "AttentionReasonCode"
wire_path = "partners[].attention[].reasonCode"
owner_domain = "partners"
meaning = "stable machine reason for an operator action"
forbidden_core_aliases = ["code", "message"]

[[nomenclature.term]]
canonical = "SportsbookResolution"
wire_path = "capability.sportsbook"
owner_domain = "trading"
meaning = "sanitized account entrypoint resolved to SportsbookId plus optional skin metadata"
forbidden_core_aliases = ["book", "provider", "rawUrl"]

[[nomenclature.term]]
canonical = "BetStructureCapability"
wire_path = "capability.betStructures[]"
owner_domain = "trading"
meaning = "explicit straight, parlay, and same-game-parlay support state"
forbidden_core_aliases = ["allowsParlays", "parlayFlag"]

[[nomenclature.term]]
canonical = "WagerOfferCatalog"
wire_path = "capability.wagerOfferCatalog"
owner_domain = "trading"
meaning = "observed sports, markets, and phases; distinct from promotions"
forbidden_core_aliases = ["offers", "promos"]

[[nomenclature.term]]
canonical = "PromotionOfferCatalog"
wire_path = "capability.promotionOfferCatalog"
owner_domain = "trading"
meaning = "promotional references that never authorize wager execution"
forbidden_core_aliases = ["offers", "markets"]

[[nomenclature.term]]
canonical = "OutLimitFact"
wire_path = "capability.limits[]"
owner_domain = "compliance"
meaning = "provenance-complete account ceiling with kind, status, money, and scope"
forbidden_core_aliases = ["maxBet", "winMax", "limitNumber"]

[[nomenclature.term]]
canonical = "ExecutionConstraintDecision"
wire_path = "executionConstraintDecision"
owner_domain = "trading"
meaning = "pure out-level allow, deny, or manual-review preflight"
forbidden_core_aliases = ["authorized", "ready"]

[[nomenclature.term]]
canonical = "TennisOutCapacityObservation"
wire_path = "adapters.tennisCapacity.observations[]"
owner_domain = "trading"
meaning = "live-only out capacity and credential evidence from the authenticated Tennis contract bake"
forbidden_core_aliases = ["tennisOut", "capacityRow"]

[[nomenclature.term]]
canonical = "PartnerCommunicationObservation"
wire_path = "adapters.telegramHandshake.observations[]"
owner_domain = "telegram"
meaning = "handshake and DM linkage observation without invite URLs or invented membership detail"
forbidden_core_aliases = ["telegramStatus", "chatConfig"]

[[nomenclature.term]]
canonical = "PartnerLimitChangeObservation"
wire_path = "adapters.limitChanges.observations[]"
owner_domain = "compliance"
meaning = "historical limit change event that is never the current executable ceiling"
forbidden_core_aliases = ["currentLimit", "maxBet"]

[metadata.decision_log]
partner_identity = "PartnerCode is the only canonical partner join key; external partnerId values stay qualified"
money_storage = "Financial amounts and balances use integer minor units with explicit currency and scope"
telegram_boundary = "Telegram owns communication transport and cannot own lifecycle or accounting truth"
legacy_ops = "legacy-ops is the eighth compatibility adapter and has an explicit retirement condition"
frozen_mapping = "Sports Terminal frozen maps to suspended with mandatory queryable provenance"
out_constraints = "Max stake, gross payout, net win, and liquidity are distinct checks; missing evidence requires manual review"
offer_split = "Wager markets and structures are separate from promotional offers"
bookmaker_host_resolution = "Account URLs resolve by exact host or explicit alias; unknown hosts require a registered manual choice"
tennis_evidence = "Only live Tennis v1 contract bakes may contribute max-stake evidence; offline joins are visibility only"
telegram_evidence = "Handshake artifacts do not expose membership counts or configured topic keys and those fields must not be invented"
limit_change_evidence = "Limit raises are historical events and may trigger attention but never replace a fresh execution ceiling"

[deprecation_calendar.legacy_ops]
status = "active"
owner = "@factorywager/partners/compatibility"
announced_at = "2026-08-05"
cutoff_date = "2026-11-03"
check_cadence = "weekly"
enforcement = "partner-dashboard-plan-validator-fails-after-cutoff-until-status-retired"
notification_target = "partner-platform-slack"
scheduled_enforcement_status = "required-not-yet-wired"
removal_runbook = [
  "verify-zero-legacy-ingress-translations-for-30-days",
  "verify-all-four-current-partners-have-canonical-profiles",
  "remove-legacyOps-artifact-key-and-connector",
  "remove-legacy-partners-ops-v2-adapter",
  "remove-compatibility-projection-tests-and-update-contract-version",
]

[identity.partner_code]
type = "PartnerCode"
wire_field = "partnerCode"
pattern = "^[A-Z]{3,6}$"
role = "canonical-cross-domain-business-join-key"
display_label = "CODE"
bare_partner_id_policy = "forbidden-in-core-use-qualified-external-ref"

[identity.tree_node_id]
type = "TreeNodeId"
role = "operations-entity-primary-key"
join_policy = "may-reference-partner-code-but-never-replace-it"

[identity.partner_call_sign]
type = "PartnerCallSign"
pattern = "^[A-Z]{3,6}-[0-9]{3}$"

[identity.seat_call_sign]
type = "SeatCallSign"
pattern = "^[A-Z]{3,6}-[0-9]{3}(?:-SUB[0-9]{2}){0,2}$"

[identity.out_id]
type = "OutId"
pattern = "^out-([A-Z]{3,6})-([1-9][0-9]*)$"
role = "canonical-partner-scoped-out-identity"
target_parser = "parseCanonicalOutId"
implementation_status = "implemented"

[identity.legacy_seat_out_token]
type = "LegacySeatOutToken"
pattern = "^([A-Z]{3,6})-([1-9][0-9]*)$"
policy = "ingress-only"

[ingress]
translator = "IngressTranslator"
owner = "@factorywager/partners/compatibility"
implementation_status = "translator-implemented"
stage = "before-core-parse"
callers = ["http-bff", "cli", "artifact-adapter"]
caller_integration_status = "unwired"
telemetry_emission_status = "unwired"
unknown_mapping = "reject"
telemetry_counter = "partner_ingress_translation_total"

[ingress.http]
route_status = "no-canonical-route"
auth_integration_status = "unwired"
accepted_media_types = []
multipart_status = "unsupported-not-required"

[ingress.mappings.legacy_seat_out_token]
from_pattern = "^([A-Z]{3,6})-([1-9][0-9]*)$"
to_template = "out-{code}-{sequence}"
canonical_pattern = "^out-([A-Z]{3,6})-([1-9][0-9]*)$"
canonical_parser = "parseCanonicalOutId"
canonical_parser_implementation_status = "implemented"
emit_deprecation_warning = true
warning_emission_owner = "future-ingress-caller"
deprecation_warning_code = "partner.out_id.legacy_translated"
preserve_original_as_provenance = true
sunset_condition = "zero-production-translations-for-30-days-and-all-producers-canonical"

[lifecycle]
state_type = "PartnerLifecycleState"
state_field = "state"
states = [
  "signup",
  "materialized",
  "kyc_pending",
  "active",
  "cultivating",
  "graduated",
  "suspended",
  "terminated",
]
operational_phase_type = "PartnerOperationalPhase"
operational_phase_field = "operationalPhase"
operational_phase_authority = "derived"

[lifecycle.compatibility]
legacy_type_alias = "PartnerLifecycleStatus"
legacy_field = "lifecycle.status"

[[lifecycle.external_state_mappings]]
source_system_id = "sports-terminal"
adapter_id = "sports-terminal"
adapter_version = "2"
external_state = "frozen"
canonical_state = "suspended"
mapping_method = "declared"
confidence = "exact"

[provenance.fact]
required = true
fields = [
  "sourceSystemId",
  "adapterId",
  "adapterVersion",
  "observedAt",
  "mappingMethod",
  "confidence",
]
optional_fields = ["sourceRecordRef"]
lifecycle_required_fields = ["originalValue"]
fact_time_field = "effectiveAt"
mapping_methods = ["identity", "declared", "derived", "heuristic"]
confidence_values = ["exact", "approximate", "unknown"]

[money]
representation = "integer-minor-units"
currency = "explicit-iso-4217"
scope = "partner-or-out-or-rail-discriminated-union"
sqlite_storage = "INTEGER"
cross_currency_sum = false

[out_status_dimensions]
operational_status = ["unknown", "ready", "deferred", "paused", "blocked"]
funding_status = ["unknown", "unfunded", "partial", "funded"]
provider_connection_status = ["unknown", "active", "inactive", "pending"]
legacy_fund_status_policy = "translate-with-provenance-never-copy"
policy = "never-collapse-into-one-status-field"

[out_capabilities]
schema = "factorywager.partner-out-capability.v1"
resolution_methods = ["exact", "alias", "manual"]
bet_structures = ["straight", "parlay", "same_game_parlay"]
capability_support = ["supported", "unsupported", "unknown"]
market_phases = ["pregame", "live"]
limit_kinds = ["max_stake", "max_gross_payout", "max_net_win", "daily_stake", "weekly_stake"]
critical_limit_kinds = ["max_stake", "max_gross_payout", "max_net_win"]
limit_statuses = ["known", "not_applicable", "unknown"]
credential_readiness = ["configured", "missing", "unknown"]
execution_authorization = ["allowed", "blocked", "unknown"]
decision_values = ["allow", "deny", "manual_review"]
constraint_outcomes = ["pass", "fail", "unknown", "not_applicable"]
global_critical_limit_facts_required = true
scope_specific_override_policy = "most-specific-matching-scope"
equal_specificity_policy = "reject-ambiguous-match"
cross_currency_policy = "reject-no-implicit-conversion"
promotions_gate_execution = false

