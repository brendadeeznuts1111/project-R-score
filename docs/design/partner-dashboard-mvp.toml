[governance.money_sql]
command = "bun run lint:money-sql:staged"
hook = "scripts/pre-commit.ts"
column_name_contains = ["balance", "amount", "price"]
forbidden_storage_types = ["REAL", "FLOAT", "DOUBLE", "DOUBLE PRECISION"]
preferred_storage = "INTEGER-minor-units"
allowed_exact_fallback = "NUMERIC(20,0)"

[data_migrations.money_integer]
owner = "root-operations-db-partner-ledger"
runbook = "docs/design/partner-money-integer-migration.md"
command = "bun run partner:money:migrate -- --db <operations.db>"
canonical_columns = ["amount_minor", "balance_after_minor"]
legacy_columns = ["amount", "balance_after"]
phases = ["plan", "prepare", "backfill", "verify", "finalize"]
default_phase = "plan"
mutations_require_apply = true
finalize_requires_new_backup = true
mixed_partner_currencies = "reject"
backfill_rounding = "reject-values-beyond-iso-4217-minor-unit-precision"

[runtime]
authority = "config/bun-channels.toml"
status_artifact = "public/registry/bun-channel-status.json"
production_channel_key = "policy.runtime_channel"
static_toml_loader = "import-with-type-toml"
dynamic_toml_loader = "Bun.Glob+Bun.file+Bun.TOML.parse"
writer = "not-required-for-mvp"
writer_candidate = "Bun.TOML.stringify"
writer_candidate_status = "requires-runtime-promotion-and-version-scoped-contract-proof"
mutation_policy = "do-not-enable-native-writes-before-runtime-promotion-and-contract-proof"

[core]
ownership_status = "target-contract"
owns = [
  "partner-code",
  "profile",
  "lifecycle",
  "phase-derivation",
  "book-account-reference",
  "risk-and-sor-policy",
  "cultivation-policy",
  "commercial-agreement-terms",
  "dashboard-read-model",
  "out-capability-contract",
  "execution-constraint-evaluation",
]
implemented_now = ["partner-code", "dashboard-artifact-boundary", "artifact-assembler", "profile-coverage-adapter", "out-capability-contract", "execution-constraint-evaluation"]
planned = [
  "profile",
  "lifecycle-domain-logic",
  "phase-derivation",
  "book-account-reference-adapters",
  "risk-and-sor-policy",
  "cultivation-policy",
  "commercial-agreement-terms",
  "adapter-reconciliation",
]
must_not_import = ["telegram-api", "bun:sqlite", "vault-crypto", "portal-dom"]

[reconciliation]
profile_precedence = ["canonical-profile-config"]
capacity_precedence = ["tennis-contract", "sports-terminal"]
communication_precedence = ["telegram-handshake"]
finance_precedence = ["accounting-ledger"]
conflict_policy = "emit-conflict-never-latest-wins"
registered_outs_metric = "distinct-from-active-outs"
profile_coverage = "all-four-current-codes-required-for-implementation-ready"

[connector_defaults.resilience]
timeout_ms = 3000
stale_acceptable_seconds = 300
max_last_known_good_age_seconds = 86400
on_failure = "show_last_known_good_with_warning"
circuit_breaker_threshold = 3
circuit_breaker_open_seconds = 60
circuit_breaker_recovery_successes = 1
required_source_failure = "use-last-known-good-within-stale-window-else-fail-bake"
optional_source_failure = "use-last-known-good-within-max-age-else-mark-unavailable"

