global:
  resolve_timeout: 5m

route:
  receiver: "telegram-ops"
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "telegram-ops"
      repeat_interval: 1h

receivers:
  - name: "telegram-ops"
    webhook_configs:
      - url: "http://127.0.0.1:9094/alerts"
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json
        # Message is constructed via the webhook body
