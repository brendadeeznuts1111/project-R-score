global:
  resolve_timeout: 5m

route:
  receiver: 'telegram-ops'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'telegram-ops'
      repeat_interval: 1h

receivers:
  - name: 'telegram-ops'
    webhook_configs:
      - url: 'https://api.telegram.org/bot8972341795:AAGTTI7cdgDVfqlM81Eddw_jmhP996uiA70/sendMessage'
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json
        # Message is constructed via the webhook body
