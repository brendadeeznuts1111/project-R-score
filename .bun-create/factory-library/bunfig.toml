# Project bunfig.toml
# @see https://bun.com/docs/runtime/console — console depth
# @see https://bun.com/docs/runtime/bunfig#run-noorphans-dont-leave-orphan-processes-behind — noOrphans
# @see https://bun.com/docs/pm/global-store — isolated global virtual store
# @see https://bun.com/docs/bundler/fullstack#inline-environment-variables — inline env vars

[install]
# The global store is effective only with the isolated linker. Packages are
# shared through Bun's cache while this project's node_modules stays isolated.
linker = "isolated"
globalStore = true
# A new scaffold has no lockfile yet. Allow the first install and intentional
# dependency updates; CI can set this to true after committing bun.lock.
frozenLockfile = false

[run]
# Exit when the parent process dies — keeps CI pipelines clean.
# Equivalent to: bun --no-orphans run ./cli.ts
noOrphans = true

[console]
# Object inspection depth for console.log / Bun.inspect output.
depth = 4

# Keep [test.reporter] unset: normal `bun test` remains the readable console
# reporter. `bun run test:junit` opts into JUnit XML for a specific CI/report
# run, rather than writing a report on every local test command.

[test]
# Coverage is opt-in through test:coverage / test:coverage:lcov, but its
# measured denominator should be library source rather than test source.
coverageSkipTestFiles = true
# Do not set coverageThreshold, coveragePathIgnorePatterns, coverageDir, or
# coverageIgnoreSourcemaps without a measured consumer baseline. Bun defaults
# to text output, coverage/, no extra ignores, and source-map-aware reporting.

[serve.static]
# Inline only PUBLIC_* env vars into frontend bundles at build time.
# Use this to expose non-secret browser configuration such as a registry URL.
# Never expose credentials, private tokens, or API keys through PUBLIC_*.
# @see https://bun.com/docs/bundler/fullstack#inline-environment-variables
#
# For production builds, use the equivalent Bun.build() option:
#   await Bun.build({ env: "PUBLIC_*", ... })
# @see https://bun.com/docs/bundler#env-%E2%80%9Cdisable%E2%80%9D
env = "PUBLIC_*"
