# {{name}} — project bunfig.toml
# @see https://bun.sh/docs/runtime/console — console depth
# @see https://bun.sh/docs/runtime/bunfig#run-noorphans-dont-leave-orphan-processes-behind — noOrphans
# @see https://bun.sh/docs/bundler/fullstack#inline-environment-variables — inline env vars

[run]
# Exit when the parent process dies — keeps CI pipelines clean.
# Equivalent to: bun --no-orphans run ./cli.ts
noOrphans = true

[console]
# Object inspection depth for console.log / Bun.inspect output.
depth = 4

[serve.static]
# Inline only PUBLIC_* env vars into frontend bundles at build time.
# Use this to expose factory registry URLs, API keys (public), etc.
# without hardcoding them in source.
# @see https://bun.sh/docs/bundler/fullstack#inline-environment-variables
#
# For production builds, use the equivalent Bun.build() option:
#   await Bun.build({ env: "PUBLIC_*", ... })
# @see https://bun.sh/docs/bundler#env-%E2%80%9Cdisable%E2%80%9D
env = "PUBLIC_*"
