# Publish lanes (ADR-0002) — not hosts, but part of the registry protocol map.
[publish.prod]
lane = "prod-write"
protocol = "SigV4 S3Client → R2 factory-wager-registry (no HTTP endpoint)"
entry = "bun run factory publish <path> · RegistryClient.publish"
auth = "R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (local env)"
note = "Single-writer authority on the R2 index; refresh read snapshot with ops:snapshot."

[publish.local_gateway]
lane = "local-gateway"
protocol = "POST /api/registry/:scope/:name/versions (multipart, 50 MiB cap)"
entry = "lib/factory/server.ts on http://localhost:3000"
auth = "Bearer FACTORY_WAGER_TOKEN / REGISTRY_SECRET (constant-time digest; 503 fail-closed)"
note = "Writes through to R2 when R2 env present."

[publish.local_npm]
lane = "local-npm"
protocol = "npm publish protocol — PUT /{name}, PUT /@scope/name (+ packument GET)"
entry = "scripts/serve-public.ts (loopback only; X-Registry-Lane: local-dev)"
auth = "loopback dev"
note = "bun publish works here ONLY. Writes local storage/ + registry.json — never R2 (ADR-0002)."
