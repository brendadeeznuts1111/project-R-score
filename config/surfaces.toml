# FactoryWager surfaces SSOT — every public hostname and what serves it.
# Consumed by scripts/bake-surfaces.ts → public/registry/surfaces-state.json.
# Status vocabulary:
#   live        — resolves and serves its documented purpose
#   vanity      — resolves to the Pages app but does NOT serve its implied purpose
#   broken      — resolves but origin errors (5xx)
#   dangling    — resolves with no serving config behind it
#   staged      — configured intent, not yet provisioned
#   placeholder — documented name only; nothing provisions it
#   external    — third-party service (not our infra)
#   retired     — decommissioned (DNS record removed); kept for audit trail
# Verified via dig + curl 2026-07-28. Re-verify: bake --probe (planned) or manual dig/curl.

[surfaces.apex]
host = "factory-wager.com"
backend = "cloudflare-pages:project-r-score"
status = "live"
protocol = "https-static+functions"
access = "public"
note = "Apex of the Pages app."

[surfaces.www]
host = "www.factory-wager.com"
