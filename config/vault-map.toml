# Vault map — environment variable → Proton Pass vault mapping
# Grounded in: Bun `import config from './file.toml' with { type: 'toml' }`
# See: https://bun.com/docs/pm/filter?search=type%3Atoml
#
# Naming: {DOMAIN}_{SCOPE}_{ROLE}
#   _TOKEN  = API tokens      _PAT    = Personal Access Tokens
#   _KEY    = Encryption/SSH   _SECRET = Symmetric secrets

[metadata]
version = 1
generated = "2026-07-28T00:00:00Z"
description = "Env → Proton Pass vault mapping"

[conventions]
naming = "{DOMAIN}_{SCOPE}_{ROLE}"
color_api = "Used via Bun.color(hex, 'ansi')"
icon_path = "Relative path for dashboard; Unicode fallback in terminal"

# ── R2 Storage ──────────────────────────────────────────────────────────────
[env.R2_ACCESS_KEY_ID]
vault = "factorywager"
item = "R2 bun-secrets bucket"
field = "username"
label = "R2 Access Key"
color = "#F38020"
icon = "assets/icons/r2.svg"
type = "token"

[env.R2_SECRET_ACCESS_KEY]
vault = "factorywager"
item = "R2 bun-secrets bucket"
field = "password"
label = "R2 Secret Key"
color = "#F38020"
icon = "assets/icons/r2.svg"
type = "secret"

