# ── SSH Keys ─────────────────────────────────────────────────────────────────
[env.SSH_DEPLOY_KEY]
vault = "factorywager"
item = "SSH Deploy Key"
field = "note"
label = "SSH Deploy Key"
color = "#F59E0B"
icon = "public/portal/icons/vault/ssh.svg"
type = "ssh"
filename = "id_deploy"

# SSH_CASCADE_KEY removed 2026-07-28: no distinct cascade key on disk and zero
# consumers outside this file (vault-health flagged it referencedMissing).

# ── Personal Access Tokens ───────────────────────────────────────────────────
[env.GITHUB_TOKEN]
vault = "factorywager"
item = "GitHub PAT"
field = "note"
label = "GitHub Personal Access Token"
color = "#2DA44E"
icon = "public/portal/icons/vault/github.svg"
type = "pat"

# ── Supply chain / Security scanners ─────────────────────────────────────────
# Bun [install.security] scanner = @socketsecurity/bun-security-scanner
# Free mode works without this; org policies need packages-scoped API token.
[env.SOCKET_API_KEY]
vault = "factorywager"
item = "Socket API Key"
field = "password"
label = "Socket API Key"
color = "#7C3AED"
icon = "public/portal/icons/vault/key.svg"
type = "token"

# ── Backlog ──────────────────────────────────────────────────────────────────
[backlog]
human_only = ["OPENAI_API_KEY", "SLACK_WEBHOOK_URL"]
mintable = [
  "DOD_PROOF_SECRET", "DOD_ID_ENCRYPTION_KEY", "PROVISION_ENCRYPTION_KEY",
  "PLAY_SIGNING_SECRET", "REPORT_SIGNING_SECRET",
]
