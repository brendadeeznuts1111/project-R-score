# Vault map — env key → Proton Pass display + path chrome (Bun-native TOML)
# SSOT for label/color/icon/type (+ optional vault/item/field overrides).
# Machine paths also live in env.template as KEY={{ pass://vault/item/field }}.
# Edit this file — not config/vault-map.json (legacy fallback) or the portal bake.
#
# Load:
#   import map from "../config/vault-map.toml" with { type: "toml" }
#   Bun.TOML.parse(await Bun.file("config/vault-map.toml").text())
# @see https://bun.com/docs/guides/runtime/import-toml
# @see https://bun.com/docs/runtime/toml
# @see https://bun.com/docs/bundler/loaders#toml
# @see https://protonpass.github.io/pass-cli/commands/contents/secret-references/
#
# Naming: {DOMAIN}_{SCOPE}_{ROLE}
#   _TOKEN = API tokens · _PAT = PATs · _KEY = encryption/SSH · _SECRET = symmetric

[metadata]
version = 1
generated = "2026-07-28T00:00:00Z"
description = "Env → Proton Pass vault mapping"

[conventions]
naming = "{DOMAIN}_{SCOPE}_{ROLE}"
color_api = "Used via Bun.color(hex, 'ansi')"
icon_path = "Relative path for dashboard; Unicode fallback in terminal"

# ── R2 Storage ──────────────────────────────────────────────────────────────
[env.R2_ACCESS_KEY_ID]
vault = "factorywager"
item = "R2 bun-secrets bucket"
field = "username"
label = "R2 Access Key"
color = "#F38020"
icon = "public/portal/icons/vault/r2.svg"
type = "token"

[env.R2_SECRET_ACCESS_KEY]
vault = "factorywager"
item = "R2 bun-secrets bucket"
field = "password"
label = "R2 Secret Key"
color = "#F38020"
icon = "public/portal/icons/vault/r2.svg"
type = "secret"

# ── Registry / API Tokens ───────────────────────────────────────────────────
[env.FACTORY_WAGER_TOKEN]
vault = "factorywager"
item = "FactoryWager Registry Token"
field = "password"
label = "Registry Token"
color = "#6366F1"
icon = "public/portal/icons/vault/key.svg"
type = "token"
# Consumers: monorepo publish gate · Tennis HQ cloud agent (remote sandbox install/publish)
# Status board: /registry/tennis/agent-auth.json · docs/harness/tenants/tennis-hq-registry.md
note = "Shared registry Bearer · Tennis HQ cloud agent configured · /registry/tennis/agent-auth.json"

# Tennis HQ Worker service contracts (v1 + partner money writes) — distinct from registry token
[env.PARTNER_API_TOKEN]
vault = "factorywager"
item = "Tennis HQ Partner API Token"
field = "password"
label = "Tennis HQ Partner API"
color = "#f59e0b"
icon = "public/portal/icons/vault/key.svg"
type = "token"
# Consumers: Worker secret PARTNER_API_TOKEN · /api/v1/* bearer · partner ledger writes
# Handoff: ~/.reasonix/tennis-hq-partner-api-token.env (mode 600)
# Provision: wrangler secret put PARTNER_API_TOKEN --name tennis-hq
note = "Tennis HQ service Bearer · fail-closed v1 when missing · not FACTORY_WAGER_TOKEN"

[env.REGISTRY_SECRET]
vault = "factorywager"
item = "Registry Dev Secret"
field = "password"
label = "Registry Dev Secret"
color = "#6366F1"
type = "secret"

# ── Cloudflare ───────────────────────────────────────────────────────────────
[env.CLOUDFLARE_API_TOKEN]
vault = "factorywager"
item = "Cloudflare API Token"
field = "password"
label = "Cloudflare API Token"
color = "#F38020"
icon = "public/portal/icons/vault/cloudflare.svg"
type = "token"

[env.CLOUDFLARE_DNS_API_TOKEN]
vault = "factorywager"
item = "Cloudflare API Token (DNS)"
field = "password"
label = "Cloudflare DNS Token"
color = "#F38020"
icon = "public/portal/icons/vault/cloudflare.svg"
type = "token"

# Access / Zero Trust only — plan+apply Access apps (not DNS, not general Pages)
[env.CLOUDFLARE_ACCESS_API_TOKEN]
vault = "factorywager"
item = "Cloudflare Access API Token"
field = "password"
label = "Cloudflare Access API Token"
color = "#F38020"
icon = "public/portal/icons/vault/cloudflare.svg"
type = "token"

# ── Telegram ─────────────────────────────────────────────────────────────────
[env.TELEGRAM_BOT_FACTORY]
vault = "factorywager"
item = "Telegram: factorywager_bot"
field = "password"
label = "Telegram Bot Token"
color = "#26A5E4"
icon = "public/portal/icons/vault/telegram.svg"
type = "token"

[env.TELEGRAM_WEBHOOK_SECRET]
vault = "factorywager"
item = "Telegram Webhook Secret"
field = "password"
label = "Telegram Webhook Secret"
color = "#26A5E4"
type = "secret"

# ── Ops Signing ──────────────────────────────────────────────────────────────
[env.PLAY_SIGNING_SECRET]
vault = "factorywager"
item = "Play Signing Secret"
field = "password"
label = "Play Signing Secret"
color = "#10B981"
type = "secret"

[env.REPORT_SIGNING_SECRET]
vault = "factorywager"
item = "Report Signing Secret"
field = "password"
label = "Report Signing Secret"
color = "#10B981"
type = "secret"

# ── DOD / Identity / Provisioning ────────────────────────────────────────────
[env.DOD_PROOF_SECRET]
vault = "factorywager"
item = "DOD Proof Secret"
field = "password"
label = "DOD Proof Secret"
color = "#8B5CF6"
type = "secret"

[env.DOD_ID_ENCRYPTION_KEY]
vault = "factorywager"
item = "DOD ID Encryption Key"
field = "password"
label = "DOD Encryption Key"
color = "#8B5CF6"
type = "key"

[env.PROVISION_ENCRYPTION_KEY]
vault = "factorywager"
item = "Provision Encryption Key"
field = "password"
label = "Provision Key"
color = "#8B5CF6"
