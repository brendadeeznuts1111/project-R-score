# 🔥 Fantasy42-Fire22 Branch Protection Validation
name: Branch Protection Validation

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  validate-branch-protection:
    name: 🔒 Validate Branch Protection Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/bun-action@v1
        with:
          bun-version: '1.4.0'

      - name: Validate branch naming convention
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "🔍 Validating branch: $BRANCH_NAME"

          # Validate branch naming patterns
          if [[ ! $BRANCH_NAME =~ ^(main|develop|staging|enterprise|feature/|pkg/|hotfix/|release/) ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "📋 Valid patterns:"
            echo "  - main, develop, staging, enterprise"
            echo "  - feature/<domain>-<description>"
            echo "  - pkg/<package>-<description>"
            echo "  - hotfix/<issue>-<description>"
            echo "  - release/v1.2.3"
            exit 1
          fi

          # Extract domain for domain-specific validation
          if [[ $BRANCH_NAME =~ ^feature/([^/]+)- ]]; then
            DOMAIN="${BASH_REMATCH[1]}"
            echo "🏷️ Feature branch for domain: $DOMAIN"
          elif [[ $BRANCH_NAME =~ ^pkg/([^/]+)- ]]; then
            PACKAGE="${BASH_REMATCH[1]}"
            echo "📦 Package branch for: $PACKAGE"
          fi

          echo "✅ Branch name validated: $BRANCH_NAME"

      - name: Validate CODEOWNERS requirements
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "👥 Checking CODEOWNERS requirements for: $BRANCH_NAME"

          # Check if branch requires CODEOWNERS approval
          if [[ $BRANCH_NAME =~ ^(main|develop|enterprise|feature/(security|finance|betting|compliance)) ]]; then
            echo "🔐 This branch requires CODEOWNERS approval"
            # Additional CODEOWNERS validation could be added here
          else
            echo "✅ Branch does not require CODEOWNERS approval"
          fi

  domain-validation:
    name: 🏗️ Domain-Specific Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/bun-action@v1
        with:
          bun-version: '1.4.0'

      - name: Detect domain and validate requirements
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "🔍 Analyzing branch for domain requirements: $BRANCH_NAME"

          # Extract domain from branch name
          if [[ $BRANCH_NAME =~ ^feature/([^/]+)- ]]; then
            DOMAIN="${BASH_REMATCH[1]}"
            echo "🏷️ Domain detected: $DOMAIN"

            # Domain-specific validation
            case $DOMAIN in
              security|compliance|finance|betting)
                echo "🔐 High-security domain detected"
                echo "📋 Requirements:"
                echo "  - Security team approval required"
                echo "  - Compliance audit required"
                echo "  - Enhanced testing required"
                ;;
              users|communication|content)
                echo "🔒 Medium-security domain detected"
                echo "📋 Requirements:"
                echo "  - Domain team approval required"
                echo "  - Standard testing required"
                ;;
              *)
                echo "✅ Standard domain detected"
                echo "📋 Requirements:"
                echo "  - Basic approval required"
                ;;
            esac
          fi

      - name: Validate domain-specific files
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "📁 Checking for domain-specific file changes"

          # Check if relevant domain files were modified
          if [[ $BRANCH_NAME =~ ^feature/([^/]+)- ]]; then
            DOMAIN="${BASH_REMATCH[1]}"
            echo "🔍 Looking for changes in src/domains/$DOMAIN/"

            if git diff --name-only HEAD~1 | grep -q "src/domains/$DOMAIN/"; then
              echo "✅ Domain-specific files modified"
            else
              echo "⚠️ No domain-specific files modified - please verify branch purpose"
            fi
          fi

