# Bun configuration file
# See https://bun.sh/docs/cli/bunfig

[install]
exact = true
# Auto-install peer dependencies
auto = true
# Production mode (skip devDependencies)
production = false
# Trusted dependencies (for postinstall scripts)
# trustedDependencies = []

[install.scopes]
"@factorywager" = { url = "https://registry.factory-wager.com/api/npm" }
# Scope-specific configuration
# Example: "@myorg/*" = { token = "..." }

[test]
# Test configuration
# timeout = 5000
# preload = ["./test-setup.ts"]

[run]
# Runtime configuration
# bun = "latest"
