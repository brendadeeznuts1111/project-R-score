# FactoryWager monorepo — project bunfig.toml
# Precedence (highest to lowest):
#   1. CLI flags (--port, --registry, --console-depth)
#   2. Environment variables (PORT, FACTORY_WAGER_TOKEN, NODE_ENV)
#   3. This local file (./bunfig.toml) — overrides global keys (shallow merge)
#   4. Global file (~/.bunfig.toml) — machine-wide defaults
# @see https://bun.com/docs/runtime/bunfig#global-vs-local
#
# Machine install SSOT: ~/.bunfig.toml (linker, globalStore, cache.dir, minimumReleaseAge, minimumReleaseAgeExcludes)
# Enterprise reference profile (not auto-loaded): ./.bunfig.toml
#
# Lockfile linker defaults (https://bun.com/docs/pm/isolated-installs):
#   root bun.lock MUST keep "configVersion": 1 with workspaces → isolated default.
#   Machine layer sets linker = "isolated" + globalStore = true (do not duplicate here).
#   Do not downgrade configVersion to 0 (legacy hoisted default for pre-1.3.2 projects).
#   Prove: bun run install:verify · portal-cli scanner policy

[console]
# Deep inspect for doctor gates and nested log fields (default 2 truncates too early)
# Docs: https://bun.com/docs/runtime/console (precedence: --console-depth flag > this > default 2)
depth = 6

# Process-tree hygiene for husky / CI / spawn chains (workspace-owned, like [test]/[console]).
# @see https://bun.com/docs/runtime/bunfig#run-noorphans-dont-leave-orphan-processes-behind
[run]
noOrphans = true

[debug]
# Pin editor in bunfig (matches Bun.openInEditor SSOT — bunfig > $VISUAL > $EDITOR).
editor = "cursor"

[install]
exact = true
# Hardened (gate bunfig-policy): text lockfile + frozen installs.
# Dependency changes go through bun add / bun update, not plain bun install.
saveTextLockfile = true
frozenLockfile = true

# Scoped registries — private FactoryWager packages (SSOT for Bun).
# Canonical URL per .npmrc + commit 13ce5157; both scope spellings are in use
# (42× @factorywager, 1× @factory-wager/admin-cli). Token via FACTORY_WAGER_TOKEN env var.
[install.scopes]
"@factorywager" = { url = "http://localhost:3000/", token = "$FACTORY_WAGER_TOKEN" }
"@factory-wager" = { url = "http://localhost:3000/", token = "$FACTORY_WAGER_TOKEN" }
"@factory" = { url = "http://localhost:3000/", token = "$FACTORY_WAGER_TOKEN" }
"@factorywager-prod" = { url = "https://registry.factory-wager.com/api/npm", token = "$FACTORY_WAGER_TOKEN" }

# Test runner defaults.  Per-workspace bunfig.toml files
# (e.g. projects/active/enterprise/bet-ticker-worker-v1.1/bunfig.toml) override these.
#
# Speed / isolation are CLI flags (not bunfig keys):
#   --parallel[=N]  workers (implies --isolate: fresh global per file)
#   --shard=M/N     CI matrix split (e.g. SHARD=2/4 bun run test:ci:shard)
#   --changed[=REF] import-graph filter (wrapper: bun run test:changed)
#
# Day-loop (Bun-native selection — no custom git-ls invent):
#   bun run test:dev          # --watch (import-graph / file watchers)
#   bun run test:changed      # wrapper → bun test --changed (+ parallel)
#   bun run test:concept      # concept-lane subset
#   bun run test:parallel | test:isolate | SHARD=1/4 bun run test:ci:shard
#   bun run test:ci           # junit under tests/ only
# Pre-commit uses scripts/bun-test-changed-staged.ts (HEAD ∪ staged scratch)
# so foreign worktree dirt cannot block your commit — not SKIP_TEST_CHANGED by default.
#
# Install linker=isolated lives in ~/.bunfig.toml (machine SSOT) — do not duplicate here.
# Streaming tarball extract is on by default; disable only if needed:
#   BUN_FEATURE_FLAG_DISABLE_STREAMING_INSTALL=1 bun install
#
# @see https://bun.com/docs/test/index#run-tests
# @see https://bun.com/docs/test — per-test timeout (default 5000ms; CLI --timeout overrides)
# @see https://bun.com/blog/bun-v1.3.13#bun-test-changed
# @see https://bun.com/blog/bun-v1.3.13#bun-test-isolate-and-bun-test-parallel
[test]
preload = "./tests/preload.ts"
timeout = 10000
# Coverage threshold for CI (bun test --coverage)
coverageThreshold = 0.8
# ast-grep integration scans (see .agents/skills/ast-grep/bunfig.toml for skill-local defaults)
concurrentTestGlob = [
  ".agents/skills/ast-grep/tests/integration/*.test.ts",
  ".agents/skills/ast-grep/tests/integration/**/*.test.ts",
  ".agents/skills/ast-grep/**/concurrent-*.test.ts",
]
# Nested product trees / foreign checkouts — not part of monorepo day-loop `bun test`.
# Default scripts already pass `tests/` as the root; these keep bare `bun test` clean too.
# @see https://bun.com/docs/test/configuration#pathignorepatterns
pathIgnorePatterns = [
  "node_modules/**",
  "dist/**",
  "archive/**",
  "scratch/**",
  "docs/**",
  "screenshots/**",
  "bench/**",
  "migrations/**",
  "generated/**",
  "vendor/**",
  "toc-ops-repo/**",
  "Kalshi-bot/**",
  ".codex-worktrees/**",
  "artifacts/**",
  "artifacts-browser/**",
]

# HTTP server defaults (overridden by PORT env or --port CLI flag)
# @see https://bun.com/docs/runtime/bunfig#serve
[serve]
port = 3000
hostname = "0.0.0.0"

# Build defaults for portal (Cloudflare Pages)
# @see https://bun.com/docs/runtime/bunfig#build
[build]
output = "public"

# Bun Security Scanner — https://bun.com/docs/pm/security-scanner-api
# Quota policy: install-time scanner OFF by default (this monorepo ≈ 750 lockfile packages;
# Socket free mode ≈ 1 public API hit per package per install/scan — protects free quota).
# On-demand (recommended):
#   portal-cli scanner scan --oneshot --force
# Install-time ON (only when intentionally scanning every bun install/add):
#   portal-cli scanner configure @socketsecurity/bun-security-scanner --write
# Package stays a devDependency; clear with: portal-cli scanner clear --write
# #[install.security]
# #scanner = "@socketsecurity/bun-security-scanner"

# Bun Security Scanner — https://bun.com/docs/pm/security-scanner-api
# Scanners export: { version: "1", scan({ packages }) => Advisory[] }
[install.security]
scanner = "@socketsecurity/bun-security-scanner"
