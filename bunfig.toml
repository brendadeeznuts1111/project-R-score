# FactoryWager Enterprise — bunfig.toml
# Bun runtime configuration.  Bun reads this file from the project root.
# .bunfig.toml is the enterprise profile (team-lead config), separate concern.

[install]
# Isolated linker: 20.5s → 2.4s in peer-heavy monorepos.
# Required by projects/active/enterprise/bet-ticker-worker-v1.1; safe for all workspaces.
linker = "isolated"

# Global virtual store — https://bun.sh/docs/pm/global-store
# Requires isolated linker. Warm installs link from <cache>/links/ (~7× faster).
# Opt out: globalStore = false or BUN_INSTALL_GLOBAL_STORE=0
globalStore = true

# Global cache (tarballs) — https://bun.sh/docs/pm/global-cache
# Override: BUN_INSTALL_CACHE_DIR (also relocates global store links/)
[install.cache]
dir = "~/.bun/install/cache"
disable = false
disableManifest = false

# Pin exact versions — no ^/~ drift.  Inherited from .bunfig.toml.
exact = true

# CI safety: refuse to mutate lockfile.
# In dev, drop this or set BUN_INSTALL_FROZEN_LOCKFILE=0.
frozenLockfile = false

# Minimum age before a package version is trusted (seconds).
# 3 days = 259200 — same as bet-ticker, prevents supply-chain
# attacks on freshly-published packages.
minimumReleaseAge = 259200

# Scoped registries — private @factorywager packages.
# Token via FACTORYWAGER_REGISTRY_TOKEN env var.
[install.scopes]
"@factorywager" = { url = "https://factory-wager.com/registry", token = "$FACTORYWAGER_REGISTRY_TOKEN" }

# Test runner defaults.  Per-workspace bunfig.toml files
# (e.g. projects/active/enterprise/bet-ticker-worker-v1.1/bunfig.toml) override these.
[test]
timeout = 10000
# ast-grep integration scans (see .agents/skills/ast-grep/bunfig.toml for skill-local defaults)
concurrentTestGlob = [
  ".agents/skills/ast-grep/tests/integration/*.test.ts",
  ".agents/skills/ast-grep/tests/integration/**/*.test.ts",
  ".agents/skills/ast-grep/**/concurrent-*.test.ts",
]
pathIgnorePatterns = [
  "node_modules/**",
  "dist/**",
  "archive/**",
  "scratch/**",
  "docs/**",
  "screenshots/**",
  "bench/**",
  "migrations/**",
  "generated/**",
  "vendor/**",
]
